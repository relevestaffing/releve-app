<!-- ═════════ PART THREE · THE CALL ═════════ -->

<template id="t-opening" data-title="Opening and discovery." data-hook="The first twelve minutes decide the call. You take the lead, agree how it will end, and then ask questions until the owner has described the problem and put a price on it, in their own words." data-tease="Sorting their week live, and doing the arithmetic out loud.">
  <div class="ruler rv">
    <div style="flex:3"><b>0:00</b>Frame</div>
    <div style="flex:9"><b>3:00</b>Discovery</div>
    <div style="flex:5"><b>12:00</b>Live audit</div>
    <div style="flex:5"><b>17:00</b>Why Relève</div>
    <div style="flex:4"><b>22:00</b>The offer</div>
    <div style="flex:4"><b>26:00</b>Close</div>
  </div>

  <section class="sec rv">
    <div class="k">0:00 to 3:00 · The frame</div>
    <h2>Take the lead, then agree how the call ends.</h2>
    <blockquote class="say">“<span class="v">First name</span>, thanks for making the time. How’s the week treating you so far?”</blockquote>
    <p>One beat of small talk. React to what they say, then move on. A long warm-up hands them control of the call.</p>
    <blockquote class="say">“Here’s how I’d like to use our thirty minutes, and tell me if you’d change anything. I’ll ask about the business and where your time goes. Then we’ll do a live audit together: what comes off your plate first, and what it’s worth to you. If it looks like a fit, I’ll show you how Relève works and what it costs. If it isn’t, I’ll tell you, and you keep the audit either way. Sound fair?”</blockquote>
    <blockquote class="say">“One more thing. At the end I’ll ask whether you want to get started. Yes is great and no is completely fine. All I ask is that you tell me which, so neither of us is left guessing. Okay?”</blockquote>
    <p>Wait for a real “okay.” This is what the Sandler sales method calls an <b>upfront contract</b>. Once someone has agreed out loud to give a clear answer, “let me think about it” feels like going back on their word. Saying that no is fine makes a yes feel like their own choice, because it is.</p>
  </section>

  <section class="sec rv">
    <div class="k">3:00 to 12:00 · Discovery</div>
    <h2>Five kinds of question, in this order.</h2>
    <p>The order follows Neil Rackham’s research on large sales, often called SPIN: first the situation, then the problem, then what the problem is costing, then what solving it would be worth. People believe their own conclusions far more than anything a seller tells them, so the questions do the persuading.</p>
  </section>
  <div class="acc rv">
    <details open><summary>Where they are · about 2 minutes<i></i></summary><div class="a">
      <ul class="dots">
        <li>“Tell me about the business. What do you do, and who for?”</li>
        <li>“Roughly where is revenue each month?” If they hesitate: “A range is fine. It helps me size the role.”</li>
        <li>“Who’s on the team, and what do they handle?”</li>
        <li>“How many hours are you working in a normal week?”</li>
      </ul>
      <p>Easy facts first. Answering simple questions gets them used to answering you, and you need these numbers for the audit.</p>
    </div></details>
    <details><summary>What went wrong before · about 2 minutes<i></i></summary><div class="a">
      <ul class="dots">
        <li>“What happened the last time you handed work to someone?”</li>
        <li>“What did that end up costing you?”</li>
        <li>“What would you need to see to trust someone with it again?”</li>
      </ul>
      <p>The third question is the most valuable on the call: they are telling you exactly what they need to hear to buy. Write it down word for word and answer it later in the same words. If they have never delegated, ask “What’s stopped you so far?” The answer is almost always trust or time.</p>
    </div></details>
    <details><summary>What it’s costing · about 3 minutes<i></i></summary><div class="a">
      <ul class="dots">
        <li>“Walk me through a normal week. Where does your time go that you wish it didn’t?”</li>
        <li>“Of those hours, how many are work only you can do, and how many could someone else do if you trusted them?” Write the second number down: it is the size of the handoff.</li>
        <li>“What’s the one thing that keeps slipping through the cracks?” “When it slips, what does it cost you? A client, a sale, your evenings?”</li>
        <li>“How long has it been like this?” “If nothing changes, what do the next six months look like?”</li>
      </ul>
      <p>These are implication questions. You never tell them it is costing money: they tell you. “How long has it been like this?” adds weight, because a problem that has lasted a year won’t fix itself next month.</p>
    </div></details>
    <details><summary>Where they want to be · about 1½ minutes<i></i></summary><div class="a">
      <ul class="dots">
        <li>“Say we get this right. Ninety days from now, what’s different about your week?”</li>
        <li>“If those hours were handled, where would you put them?”</li>
        <li>“What made you book this call this week, and not three months ago?”</li>
      </ul>
      <p>Once someone has pictured the better week, the week they are living starts to feel like a loss. “Why now” brings their urgency out in their own words, and you will repeat it in the close.</p>
    </div></details>
    <details><summary>Say it back · 30 seconds<i></i></summary><div class="a">
      <blockquote class="say">“Let me make sure I’ve got this. You’re at about <span class="v">revenue</span> a month, working <span class="v">hours</span> a week, and around <span class="v">handoff</span> of those hours go to <span class="v">their top three</span>. Last time you handed work off, <span class="v">what happened</span>, so what you need is someone you can actually trust with it. And if this stays the same, <span class="v">their six-month answer</span>. Did I miss anything?”</blockquote>
      <p>This earns the first of three yeses: yes, this is costing me. “Did I miss anything?” often brings out the detail they were holding back.</p>
    </div></details>
  </div>

  <section class="sec rv">
    <div class="k">Listening well</div>
    <h2>Three habits that make people keep talking.</h2>
    <ul class="dots">
      <li><b>Mirror.</b> Repeat their last few words as a question. “Every Sunday?” They will explain more.</li>
      <li><b>Label.</b> Name what you hear. “It sounds like the last hire left you doing their job as well as yours.” Being understood lowers their guard.</li>
      <li><b>Push past vague.</b> When they say “I’m just busy,” ask “What does busy look like on a Tuesday?” Specific answers make the audit real.</li>
    </ul>
  </section>

  <div class="cmp rv">
    <div><h4>Mistakes that cost the call</h4><ul>
      <li>Pitching Relève in the first ten minutes</li>
      <li>Answering a question they didn’t ask</li>
      <li>Accepting “busy” as an answer</li>
      <li>Filling every silence</li>
      <li>Talking about price before they have named a cost</li>
    </ul></div>
    <div><h4>What good sounds like</h4><ul>
      <li>They talk for four fifths of the time</li>
      <li>You write down their exact words</li>
      <li>They put a number on the cost</li>
      <li>They say what they need to trust someone</li>
      <li>They say why now</li>
    </ul></div>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>They describe the problem, they price it, and they say what would fix it. You ask.</p></div>
</template>

<template id="t-audit" data-title="The live audit." data-hook="Five minutes in which you give before you ask. You share your screen, build the role with them, and do arithmetic they can check. By the end the price has something real to stand against." data-tease="Presenting Relève as the answer to the story they told you.">
  <section class="sec rv">
    <div class="k">Sort the week</div>
    <h2>Three columns: keep, first, later.</h2>
    <blockquote class="say">“Let’s do the audit now. I’m going to sort your week into three columns: what you keep, what comes off your plate first, and what comes off later.”</blockquote>
  </section>
  <dl class="facts rv">
    <dt>Keep</dt><dd>The work only they can do: the client relationships they lead, the decisions, the creative work, the sales calls they close.</dd>
    <dt>First</dt><dd>Up to 15 hours a week of the most repetitive and painful work: the inbox, scheduling, follow-ups, data entry, posting, invoicing. This column is exactly what Starter covers.</dd>
    <dt>Later</dt><dd>Everything else that isn’t theirs to do. This column is what makes Essential the natural next step.</dd>
  </dl>
  <p class="rv">Let them place the tasks. People value what they help build (the IKEA effect), so once their own tasks sit in the columns, the role belongs to them and they want it filled.</p>

  <section class="sec rv">
    <div class="k">Do the arithmetic out loud</div>
    <h2>Their numbers, never ours.</h2>
    <blockquote class="say">“You said about <span class="v">revenue</span> a month and <span class="v">hours</span> a week. That puts your time at roughly <span class="v">hourly value</span> an hour. Fifteen hours a week of that is about <span class="v">monthly cost</span> a month of your time going to work someone else could do.”</blockquote>
    <p>The working: revenue divided by monthly hours (weekly hours times 52, divided by 12) gives their hourly value. The handoff hours a week, times the same 52 over 12, times that hourly value, is the monthly cost. Arithmetic they can check is more convincing than any claim, and using their numbers means the cost is theirs.</p>
  </section>

  <div class="mkt rv">
    <div class="mkt-h"><span>Their numbers</span><span>Their time, per hour</span><span>The handoff, per month · three months</span></div>
    <div class="mkt-r"><b>$40,000 a month, 55 hours, 15 to hand off</b><p>$168</p><p>$10,920 a month · $32,760 for three months of waiting</p></div>
    <div class="mkt-r"><b>$30,000 a month, 50 hours, 12 to hand off</b><p>$138</p><p>$7,176 a month · $21,528 for three months</p></div>
    <div class="mkt-r"><b>$80,000 a month, 60 hours, 20 to hand off</b><p>$308</p><p>$26,693 a month · $80,080 for three months</p></div>
  </div>

  <div class="calc rv">
    <div class="calc-h"><span class="k">Practise it</span><b>Type in a set of numbers and say the line out loud</b></div>
    <div class="c-in">
      <label>Revenue a month<input id="a-rev" type="number" inputmode="numeric" value="40000" min="0" step="1000"></label>
      <label>Hours they work a week<input id="a-hrs" type="number" inputmode="numeric" value="55" min="1" step="1"></label>
      <label>Hours to hand off a week<input id="a-off" type="number" inputmode="numeric" value="15" min="0" step="1"></label>
    </div>
    <div class="res">
      <div><small>Their time, per hour</small><b id="a-hour">$168</b></div>
      <div><small>Those hours, per month</small><b id="a-month">$10,920</b></div>
      <div><small>Three months of waiting</small><b id="a-three">$32,760</b></div>
    </div>
    <p class="fine">This is a way to show the value of their time, never a promise of savings or returns. Relève makes no cost claims.</p>
  </div>

  <section class="sec rv">
    <div class="k">Plant the next step</div>
    <h2>Put the later column on the screen now.</h2>
    <blockquote class="say">“The later column is what happens once the first fifteen hours are running. That’s usually when owners want someone full time.”</blockquote>
    <blockquote class="say">“If those fifteen hours were handled by someone you trusted, what would you do with them first?”</blockquote>
    <p>The first line makes Essential the expected step in three months, so it never becomes a new sale. The question is a trial close: their answer tells you how ready they are.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Give the audit first. Once $950 sits next to a five-figure number, the price no longer needs defending.</p></div>
</template>

<template id="t-present" data-title="Presenting Relève." data-hook="Now, and only now, Relève enters the call, as the answer to the story they told you. Every point you make ties back to something they said. Anything that doesn’t connect stays out." data-tease="The offer, the close, and onboarding while you’re still on the call.">
  <section class="sec rv">
    <div class="k">17:00 · Name the real problem</div>
    <h2>Take the blame off them first.</h2>
    <blockquote class="say">“You told me that last time, <span class="v">what happened</span>. That’s the story I hear most, and it almost never comes down to skill. The person had the right resume and the wrong working style. That’s the problem Relève was built to fix.”</blockquote>
    <p>Explaining why their last hire failed removes the blame from them, and someone who feels understood stops defending their past decision. Then give the founder’s background in two sentences: Sage spent seven years as an executive assistant to CEOs and six years in recruiting, and has worked with more than fifty founders since she started Relève in 2023. Credibility lands harder after they have told you what they need.</p>
  </section>

  <section class="sec rv">
    <div class="k">Six fronts, matched to their story</div>
    <h2>Say each front in one sentence. Spend longer on the one that answers them.</h2>
  </section>
  <dl class="facts rv">
    <dt>“They didn’t work the way I do”</dt><dd><b>Matched to how you work.</b> You and the candidate both take the Relève Signature™, so the fit is designed before you meet.</dd>
    <dt>“They couldn’t do the work”</dt><dd><b>Tested for the role.</b> Capability is measured against your work, including Taking The Watch™, a paid day of real work.</dd>
    <dt>“They didn’t understand my business”</dt><dd><b>Your business, studied first.</b> The free business audit, then a role built around what you actually need.</dd>
    <dt>“I couldn’t trust them”</dt><dd><b>Identity verified, and approved by name.</b> Identity and right to work confirmed, an NDA and confidentiality agreement signed, and nobody reaches you until a named person at Relève approves them.</dd>
    <dt>“Hiring took forever”</dt><dd><b>We interview many. You meet one.</b> No pile of resumes: one candidate, within 14 days of your search opening.</dd>
    <dt>“They became another job”</dt><dd><b>Two Success Managers.</b> One for you and one for your professional. Check-ins, pay, coaching, time off and cover all run through us.</dd>
  </dl>
  <p class="rv">Specific details sound true, and general ones sound like every other agency. “One person, yes or no” is believable. “Top talent” is not.</p>

  <section class="sec rv">
    <div class="k">Relief</div>
    <h2>Answer the burden fear in concrete terms.</h2>
    <blockquote class="say">“The other worry I hear is that a new person becomes another job. That’s why every placement comes with two people from our side: a Client Success Manager for you, and a Talent Success Manager for your professional. You direct the work, and we handle everything around it.”</blockquote>
    <blockquote class="say">“The 90-Day Success Plan gets them up and running. After day 90 we keep watching the work for as long as you’re with us. And if a hire doesn’t work out, we replace them, free.”</blockquote>
    <blockquote class="say">“Everyone we place is virtual and works US business hours. Every one of them signs an NDA and a confidentiality agreement. They’re comfortable with AI tools too, and can help you set up simple automations.”</blockquote>
  </section>

  <section class="sec rv">
    <div class="k">The trial close</div>
    <h2>Settle doubt before price, never after.</h2>
    <blockquote class="say">“Thinking about what happened with your last hire, does this fix the part that went wrong?”</blockquote>
    <p>A clear yes is the second of three yeses: move to the offer. Anything less: “Which part doesn’t fit yet?” Settle it here. A doubt about fit never goes away once price is on the table. It comes back dressed as “it’s too expensive.”</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Every point answers something they said. Nothing else gets airtime.</p></div>
</template>

<template id="t-close" data-title="The offer and the close." data-hook="Eight minutes. Ask permission, anchor, recommend the smaller plan, stack the value, give the guarantee, and stop talking. Then a true reason to start now, two ways to say yes, and onboarding before you hang up." data-tease="A five-question check on Part three.">
  <section class="sec rv">
    <div class="k">22:00 · Ask, then anchor</div>
    <blockquote class="say">“Would it help if I walked you through how clients start with us?”</blockquote>
    <blockquote class="say">“We have three plans. Specialist is $4,500 a month for a specialised professional hired locally in the US or Europe. Essential is $2,500 a month for a dedicated, full-time professional, prepared for your specific role before they start.”</blockquote>
    <p>Asking first means they asked to hear the price, which makes it easier to listen to. Heard after $4,500 and $2,500, $950 sounds like the small, easy step it is. Heard first, it would sound like the price of an ordinary VA.</p>
  </section>

  <section class="sec rv">
    <div class="k">Recommend down</div>
    <blockquote class="say">“Based on your audit, I wouldn’t start you on either of those. I’d start you on Starter: $950 a month for three months, up to fifteen hours a week, which covers your first column. You get the same six fronts of vetting and both Success Managers. Starter includes general preparation; preparing someone for your specific role starts at Essential.”</blockquote>
    <blockquote class="say">“Then, once those fifteen hours are running, usually around the end of the three months, you move into Essential at $2,500 and hand over the later column. Same person.”</blockquote>
    <p>Recommending the smaller plan builds trust, because you are advising them to spend less. Being open about what Starter leaves out makes the rest believable and makes Essential worth wanting later. A small yes now makes the bigger yes in three months consistent with a choice they have already made.</p>
  </section>

  <section class="sec rv">
    <div class="k">Stack it, then the guarantee</div>
    <blockquote class="say">“So for $950 a month you get a vetted, matched professional, two people on our side, the Relève app, and pay handled by us. Against about <span class="v">monthly cost</span> a month of your own time.”</blockquote>
    <blockquote class="say">“And the risk sits with us. We present a qualified candidate within 14 days of your search opening. If a hire doesn’t work out, we replace them, free. If we never present anyone, your deposit comes back.”</blockquote>
    <p><b>Then stop.</b> Silence after a price is the hardest moment on the call, and the first person to speak usually gives ground. Let it be them.</p>
  </section>

  <section class="sec rv">
    <div class="k">26:00 · A true reason to start now</div>
    <blockquote class="say">“One thing you should know before you decide. We only open ten client spots a year, because every placement is personally overseen and we won’t take on more than we can do properly. Right now <span class="v">the count on the site</span> of the ten are taken.”</blockquote>
    <blockquote class="say">“And your fourteen days start the day your search opens, so the sooner we start, the sooner you meet your person.”</blockquote>
    <p>Scarcity works when it is true and has a reason. Use the same count the website shows that day. Prospects will have seen it.</p>
  </section>

  <section class="sec rv">
    <div class="k">Two ways to say yes</div>
    <blockquote class="say">“You told me <span class="v">their why-now answer</span>. So, would you rather start monthly at $950, or pay the three months up front at $2,500 and save $350?”</blockquote>
    <p>A choice between two ways to say yes is easier than a yes or a no, and opening with their own reason for acting keeps the decision resting on their urgency, not your pitch. If they pause, return to the agreement from minute two: “I said I’d ask you at the end, and you said you’d tell me straight. Where are you?”</p>
  </section>

  <div class="cmp rv">
    <div><h4>On a yes: onboard on the call</h4><ul>
      <li>“I’m sending your onboarding now. It has your agreement and the $500 deposit, which comes off your first invoice. Open it while we’re on and I’ll walk you through it.”</li>
      <li>Cold feet happen in the gap between yes and paying. Close the gap together.</li>
      <li>Give one clear next task: the Executive Signature, about fifteen minutes, the most important thing they will do that week.</li>
      <li>End with “Consider it handled.”</li>
    </ul></div>
    <div><h4>On a no: leave goodwill</h4><ul>
      <li>“That’s completely fine, and thank you for being straight with me. Can I ask what made it a no? It helps me get better.”</li>
      <li>“I’ll send your written audit tomorrow. It’s yours to keep.”</li>
      <li>Mention the $500 thank-you for any referral we place.</li>
      <li>On a maybe, go to objections: a maybe almost always hides one specific doubt.</li>
    </ul></div>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>Recommend down, give the guarantee, then let the silence work.</p></div>
</template>
