<template id="t-decide" data-title="How owners decide." data-hook="Before you learn a single script, learn the person on the other side of it: an owner who wants a cost they can feel to stop, and who needs to believe you won’t make it worse." data-tease="Why trust has to be in place before a price can land.">
  <section class="sec rv">
    <div class="k">What they are really buying</div>
    <h2>Relief from a cost they can feel.</h2>
    <p>No owner wakes up wanting a virtual assistant. They wake up to the inbox at 6 am, the proposal they didn’t send, the weekend spent on invoices. What they want is for that to stop. Relève is how it stops. Every part of the sale works better when you keep that order: their cost first, our service second.</p>
    <p>That is why the call opens on their week and not on our plans. Until an owner has said out loud what doing everything is costing them, any price sounds expensive, because there is nothing to set it against.</p>
  </section>

  <section class="sec rv">
    <div class="k">The pull of staying the same</div>
    <h2>Doing nothing is the competitor you meet on every call.</h2>
    <p>People prefer the situation they already have, even when it is costing them. Psychologists call it <b>status quo bias</b>. The owner’s current week is painful, but it is familiar and it has no risk of embarrassment. Hiring someone new has both. So an owner will often live with a known cost rather than take an unknown risk.</p>
    <p>Two forces move someone past it. The cost of staying the same has to become clear and specific, in their own words and numbers. And the risk of changing has to become small: a small first step, a person they can trust, and a promise that if it doesn’t work, it gets fixed. Most of this training is one of those two jobs.</p>
  </section>

  <div class="cmp rv">
    <div><h4>Makes staying the same feel safe</h4><ul>
      <li>A vague problem: “I’m busy”</li>
      <li>A big, uncertain first step</li>
      <li>A seller they don’t yet trust</li>
      <li>A past hire that went wrong and was never explained</li>
      <li>No reason to act this month rather than next</li>
    </ul></div>
    <div><h4>Makes the change feel safe</h4><ul>
      <li>A cost they named and put a number on</li>
      <li>A small first step: Starter, one column of work</li>
      <li>Someone who listened and got the details right</li>
      <li>An explanation of why the last hire failed, and why this one won’t</li>
      <li>A true reason to start now</li>
    </ul></div>
  </div>

  <section class="sec rv">
    <div class="k">Feeling, then reasons</div>
    <h2>People decide with feeling and explain with reasons.</h2>
    <p>Owners are smart, and they will want the facts: the plans, the terms, the 14 days. But the decision itself usually comes earlier, in a moment of feeling: “this person understands my week” or “I am done living like this.” The facts then give them a way to explain the decision, to a partner and to themselves.</p>
    <p>So give them both, in order. Let them feel the cost and feel understood first. Then hand them clear, checkable facts to stand on. A pitch that is all features misses the moment. A pitch that is all feeling falls apart when they tell their partner.</p>
  </section>

  <section class="sec rv">
    <div class="k">Who is on the other side</div>
    <h2>The Relève buyer, in their own words.</h2>
    <ul class="dots">
      <li>“I don’t have time to train someone.” The burden fear.</li>
      <li>“I tried a VA and ended up doing it myself.” A trust wound from a past hire.</li>
      <li>“I don’t know what I would even give them.” They can’t see the role yet, which is why the live audit exists.</li>
      <li>“Can I trust someone overseas with my clients?” Trust, attached to geography.</li>
      <li>“I should be able to handle this.” Pride. Never make them feel the need for help is a failure.</li>
    </ul>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Make the cost of staying the same clear, and the risk of changing small. That is the whole job.</p></div>
</template>

<template id="t-trust" data-title="Trust comes before price." data-hook="An owner will not hear a price from someone they don’t trust yet. Trust is built piece by piece, from small things you do on the call." data-tease="The principles of persuasion we use, and the line we never cross.">
  <section class="sec rv">
    <div class="k">How trust is built</div>
    <h2>Four things raise it. One thing destroys it.</h2>
    <p>A useful way to think about trust comes from the consultant David Maister. People trust you more when three things are high and one is low:</p>
  </section>
  <dl class="facts rv">
    <dt>Credibility</dt><dd><b>Do you know what you’re talking about?</b> Shown by being specific: the exact steps of a handoff, the real arithmetic of their week, how the Signature actually works. Vague claims (“top talent”, “best in class”) lower credibility.</dd>
    <dt>Reliability</dt><dd><b>Do you do what you say?</b> Shown in small promises kept: the call starts on time, the written audit arrives within 24 hours as you said, the follow-up comes on the day you named.</dd>
    <dt>Intimacy</dt><dd><b>Is it safe to tell you the truth?</b> Shown by listening, saying their words back, and never using what they tell you against them. Owners share more with someone who doesn’t flinch at the messy parts.</dd>
    <dt>Self-orientation</dt><dd><b>Are you here for you, or for them?</b> The one that destroys trust when it is high. Talking too much, rushing to the price, or pushing the biggest plan all signal it. Recommending the smaller plan, and saying when Relève isn’t a fit, lowers it.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">On the call</div>
    <h2>What trust looks like in practice.</h2>
    <ul class="dots">
      <li><b>Listen for most of the call.</b> Aim to talk about a fifth of the time. Each time you want to explain, ask the next question.</li>
      <li><b>Say it back in their words.</b> “You said the inbox takes your mornings and the invoices take your Sundays.” Hearing their own words back is rare, and it shows you were listening.</li>
      <li><b>Be specific, and admit the limits.</b> “Starter includes general preparation. Preparation for your specific role starts at Essential.” Being honest about what a plan leaves out makes everything else you say more believable.</li>
      <li><b>Recommend down.</b> Suggesting the smaller plan is the strongest trust signal there is, because it is the opposite of what a self-interested seller would do.</li>
      <li><b>Keep the small promises.</b> If you said you would send something by Tuesday, send it Monday.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">Why Relève is easy to trust</div>
    <h2>Our process is the proof.</h2>
    <p>Relève’s whole design answers the trust question, so you don’t need to oversell it. You only need to explain it clearly: six fronts of vetting, a working style match on both sides, one candidate approved by name, two Success Managers, a free replacement if a hire doesn’t work out, and a deposit that comes back if we never present anyone. Each of those is a promise the owner can check.</p>
    <p>Sage’s story carries trust too. She spent seven years as an executive assistant to CEOs and six years in recruiting, and Relève began in January 2023 as her own practice before the website and app launched. Use it in two sentences, at the right moment: after the owner has told you what they need, not at the start.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Be specific, keep small promises, and recommend what’s right for them, even when it’s the smaller sale.</p></div>
</template>

<template id="t-principles" data-title="The principles we use, and the line we never cross." data-hook="Persuasion is a set of well-studied patterns in how people decide. Used honestly, they help an owner make a good decision faster. Used dishonestly, they are manipulation, and Relève doesn’t do it." data-tease="A five-question check on Part one.">
  <div class="mkt rv">
    <div class="mkt-h"><span>The principle</span><span>How we use it</span><span>The line we never cross</span></div>
    <div class="mkt-r"><b>Reciprocity</b><p>We give first: the live audit on the call and the written audit after, theirs to keep either way. People want to return a genuine favour.</p><p>Never a “free” gift with strings, and never reminding them what they owe you.</p></div>
    <div class="mkt-r"><b>Commitment and consistency</b><p>Small, spoken agreements: the upfront contract at minute two, the trial close, Starter as a first step. People like to act in line with what they have already said.</p><p>Never tricking someone into a yes, or holding a casual word against them.</p></div>
    <div class="mkt-r"><b>Loss aversion</b><p>A loss weighs more than an equal gain (Kahneman and Tversky’s research). We show what waiting costs, using their own numbers: three months of the hours they named.</p><p>Never inventing a loss, exaggerating a risk, or scaring someone.</p></div>
    <div class="mkt-r"><b>Anchoring</b><p>The first number heard sets the scale for the rest. We present Specialist and Essential before recommending Starter, so $950 is heard as the easy first step it is.</p><p>Never a fake “usual price” or a made-up discount.</p></div>
    <div class="mkt-r"><b>Scarcity</b><p>Relève opens only 10 client spots per year, because every placement is personally overseen. We say it once, with its reason and the same count the website shows that day.</p><p>Never a false deadline, an invented count, or scarcity used as pressure. Never in an email, post or follow-up.</p></div>
    <div class="mkt-r"><b>Authority</b><p>Sage’s background and our process, stated plainly and briefly, once the owner has said what they need.</p><p>Never borrowed credentials, inflated numbers or name-dropping to impress.</p></div>
    <div class="mkt-r"><b>Social proof</b><p>Only what is true and documented: Sage’s placements and the founders Relève has worked with since 2023.</p><p>Never an invented client, result, quote or testimonial. Ever.</p></div>
    <div class="mkt-r"><b>Liking</b><p>Real interest in their business and their week. People say yes to people who understand them.</p><p>Never flattery, and never pretending to agree.</p></div>
    <div class="mkt-r"><b>The IKEA effect</b><p>People value what they help build. The owner places their own tasks into the audit columns, so the role becomes theirs.</p><p>Never steering them into a role they don’t need.</p></div>
  </div>

  <section class="sec rv">
    <div class="k">The test</div>
    <h2>Would you be comfortable if they could see exactly what you were doing, and why?</h2>
    <p>That is the line between influence and manipulation. Showing an owner the real cost of their week, in their own numbers, passes. Telling them a spot will be gone by Friday when it won’t fails. If you would be embarrassed to explain a move to the owner afterwards, don’t make it.</p>
    <p>There is a practical reason too. Relève’s clients stay with us for months and years, and they talk to other owners. A client who felt pushed into a yes is the most expensive client we can have.</p>
  </section>

  <div class="panel flag rv">
    <p><b>Relève never pressures.</b> No invented claims, numbers, results or deadlines. No cost claims of any kind. No candidate promised before the search opens. A no is always a complete and welcome answer.</p>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>Use what is true to help them decide. Never use what isn’t.</p></div>
</template>

<template id="t-prospect" data-title="Prospecting with intent." data-hook="The best sales call is with the right owner. A minute spent choosing who to reach out to saves an hour on a call that was never going to fit." data-tease="Word-for-word messages for LinkedIn, and the rules behind them.">
  <section class="sec rv">
    <div class="k">Who we look for</div>
    <h2>The profile, in sixty seconds.</h2>
  </section>
  <dl class="facts rv">
    <dt>Must have</dt><dd>US-based. Founder, Owner, CEO or Managing Partner. A business of one to ten people. Two or more years in the role. Work that can be done remotely.</dd>
    <dt>Signs of fit</dt><dd>They post about being stretched, wearing every hat or working late. They have recently posted a job for remote help. Their business is growing: new offers, new hires, speaking, a launch. They run a business where their own time is the product.</dd>
    <dt>Best industries</dt><dd>Coaching and consulting. Agencies and professional services. Real estate and property management. E-commerce and direct-to-consumer. Health and wellness.</dd>
    <dt>Skip</dt><dd>Corporate employees, large companies, roles that need someone on site, businesses outside the US, and anyone selling VA services themselves.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">Sales Navigator</div>
    <h2>Three campaigns, one opening angle.</h2>
    <p>We run three Sales Navigator campaigns, each filtered to US founders and owners with one to ten employees and at least two years in their role:</p>
    <ol class="nums">
      <li><b>Coaching and consulting.</b></li>
      <li><b>Agencies and professional services.</b></li>
      <li><b>Real estate and property.</b></li>
    </ol>
    <p>The angle is the same across all three: “You’ve built the business. You shouldn’t have to keep doing everything inside it.” The industry changes who we reach, never what we say. Our message works for any owner, because their week looks the same in every industry: the inbox, the calendar, the follow-up, the invoices.</p>
  </section>

  <section class="sec rv">
    <div class="k">Warm before cold</div>
    <h2>Comment first. Connect second.</h2>
    <p>An owner who has seen your name before replies far more readily than one who hasn’t. Before you connect, leave a useful comment on something they posted: one real thought that adds to what they said. When a founder posts that they are hiring remote help, comment with something genuinely helpful about the hire. Never pitch in a comment.</p>
    <ul class="dots">
      <li>A good comment adds a fact, a question or an experience. “Great post!” adds nothing.</li>
      <li>Keep it about them and their post. Relève isn’t mentioned.</li>
      <li>Connect a day or two later, once your name is familiar.</li>
    </ul>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Choose carefully, warm up first, and the call starts halfway won.</p></div>
</template>

<template id="t-outreach" data-title="Messages that get answered." data-hook="Founders get pitched every day, and they delete it on sight. Our messages read like one peer writing to another: curious, short, and useful even if they never reply." data-tease="Turning a reply into a booked call, and preparing for it.">
  <section class="sec rv">
    <div class="k">The rules</div>
    <h2>Peer to peer, never a pitch.</h2>
    <ul class="dots">
      <li>LinkedIn outreach goes from Sage’s profile and is signed simply “Sage.” Email always goes as Relève.</li>
      <li>Connection request first, then a message once they accept. InMail only for owners you can’t connect with.</li>
      <li>The first message doesn’t mention Relève. It opens a conversation.</li>
      <li>When Relève comes up, call it “a remote executive staffing firm,” and the meeting a “Zoom coffee.”</li>
      <li>Only the first name, and sometimes the industry, changes from message to message.</li>
      <li>Every follow-up adds something: an insight, an exercise, a question. Never “circling back,” “following up” or “checking in.”</li>
      <li>No prices in messages. If they ask, point them to the website.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">The sequence</div>
    <h2>Word for word.</h2>
  </section>
  <div class="acc rv">
    <details><summary>The connection note<i></i></summary><div class="a">
      <blockquote class="say">“Hi <span class="v">first name</span>, I keep a short list of founders whose work I want to follow, and yours made it. I spent years as an executive assistant to CEOs and have helped scale a few businesses past seven figures, so I’m always curious how owners are building. Glad to connect. Sage”</blockquote>
      <p>Why it works: it is about them, it gives a reason to accept, and it asks for nothing.</p>
    </div></details>
    <details><summary>The first message, once they accept<i></i></summary><div class="a">
      <blockquote class="say">“Thanks for connecting, <span class="v">first name</span>. A question I ask every founder I meet: what’s one thing you’re still doing every week that you know someone else should own? I collect the answers, and the patterns are useful. Happy to share what I’m seeing. Sage”</blockquote>
      <p>Why it works: an easy, interesting question about their week. Answering it makes them name the cost, which is the first step of the sale, before Relève has been mentioned.</p>
    </div></details>
    <details><summary>When they answer<i></i></summary><div class="a">
      <blockquote class="say">“That’s one of the most common answers I hear, and it’s usually the one costing the most. I run Relève, a remote executive staffing firm, and part of what I do is a free delegation audit: we look at your week together and sort out what should come off your plate first. No pitch unless it fits. Want to grab a Zoom coffee this week?”</blockquote>
      <p>Why it works: it rewards their answer, introduces Relève as something useful, and offers value first (the audit) with an honest “no pitch unless it fits.”</p>
    </div></details>
    <details><summary>InMail, for owners you can’t connect with<i></i></summary><div class="a">
      <blockquote class="say">Subject: A question about your week<br><br>“Hi <span class="v">first name</span>, I’ve helped scale several businesses past seven figures, and now I run Relève, a remote executive staffing firm. The question I ask every founder: what are you still doing every week that someone else should own? If you’re curious, I do a free 30-minute delegation audit over a Zoom coffee. We sort your week into what you keep and what comes off first, and you keep the audit either way. Sage”</blockquote>
    </div></details>
    <details><summary>Follow-up one, about four days later<i></i></summary><div class="a">
      <blockquote class="say">“Something that helps the owners I talk to: for one day this week, write K, F or L next to everything you do. K for keep, F for the first things to hand off, L for later. Most people find their F list is longer than they expected. Sage”</blockquote>
      <p>Why it works: it is a real exercise they can do without us. It gives value and quietly sets up the audit.</p>
    </div></details>
    <details><summary>Follow-up two, about ten days later, then stop<i></i></summary><div class="a">
      <blockquote class="say">“A pattern I keep seeing: the task owners hate most usually isn’t the right first handoff. The one they repeat most is. If you ever want a second pair of eyes on your list, the Zoom coffee offer stands. Sage”</blockquote>
      <p>After this one, stop. Two thoughtful follow-ups are generous. A third starts to feel like pressure.</p>
    </div></details>
    <details><summary>When they say no<i></i></summary><div class="a">
      <blockquote class="say">“Completely understand, and thank you for telling me. If it’s useful, our free training, The Handled Business, walks through where a virtual professional fits in each part of a business: relevestaffing.com/training. And if you know a founder who’s buried in work that isn’t theirs, we send a $500 thank-you for any introduction we place. Sage”</blockquote>
    </div></details>
    <details><summary>When they ask “how much?”<i></i></summary><div class="a">
      <blockquote class="say">“It depends on the role, and our plans are on the website at relevestaffing.com/pricing. I’d rather show you which one fits your week than quote one blind. Thirty minutes for the audit?”</blockquote>
    </div></details>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>Ask about their week, give something useful, and let Relève appear late.</p></div>
</template>

<template id="t-booking" data-title="From a reply to a booked call." data-hook="A yes in the inbox is not a call yet. The steps between a reply and the call decide whether the owner shows up, and how ready you are when they do." data-tease="A five-question check on Part two.">
  <section class="sec rv">
    <div class="k">Booking</div>
    <h2>Make it one click, today.</h2>
    <ul class="dots">
      <li>Send the booking page the moment they say yes: relevestaffing.com/discovery. It books a free 30-minute call.</li>
      <li>Offer it as a choice of two times when you can: “Would Thursday morning or Friday afternoon suit you?” A choice is easier to answer than an open question.</li>
      <li>Once it’s booked, the person appears in the console under Directory, Prospects, with the call on it.</li>
      <li>Never promise a candidate, a match or a start date before the call. The call is for understanding their business.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">Before the call</div>
    <h2>Fifteen minutes of preparation.</h2>
  </section>
  <dl class="facts rv">
    <dt>Their business</dt><dd>Read their website and LinkedIn. What do they sell, and to whom? How big is the team? What are they launching or posting about?</dd>
    <dt>A first guess</dt><dd>Write down three things you think they would hand off first. You will test this, not present it.</dd>
    <dt>eLIVate Club</dt><dd>Check whether they are a member. It changes what you say about the move to Essential.</dd>
    <dt>Their answers so far</dt><dd>Reread every message they sent and the answers to the booking questions. Bring their words to the call.</dd>
    <dt>The count</dt><dd>Check how many client spots the website shows as taken today, so what you say matches what they have seen.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">The day before</div>
    <h2>One short note that raises the show rate.</h2>
    <blockquote class="say">“Looking forward to tomorrow, <span class="v">first name</span>. One question so I can make the half hour useful: what would you most like to walk away with?”</blockquote>
    <p>Why it works: a question they answer becomes a small commitment to the call, and their answer tells you what to lead with. Keep every email before the call low pressure and helpful. None of them links into the app.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Book it fast, prepare properly, and arrive knowing their words.</p></div>
</template>
