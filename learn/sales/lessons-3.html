<!-- ═════════ PART FOUR · AFTER THE CALL ═════════ -->

<template id="t-objections" data-title="Objections, in depth." data-hook="Almost every objection is one of two things: a risk the owner still feels, or a value they can’t see yet. Find which, and answer that. Never argue with the words on the surface." data-tease="Following up, moving clients to Essential, and asking for referrals.">
  <section class="sec rv">
    <div class="k">What an objection really is</div>
    <h2>Risk not yet removed, or value not yet seen.</h2>
    <p>“It’s too expensive” rarely means the owner can’t afford $950. It usually means the cost of their week isn’t vivid enough yet, or they don’t yet believe the hire will work. “Let me think about it” rarely means they need time. It usually means one specific doubt they haven’t said out loud, and status quo bias is filling the gap. Your job is to find that one doubt.</p>
  </section>

  <div class="method rv">
    <div><b>Acknowledge</b><span>“That makes sense.” Never “but.”</span></div>
    <div><b>Isolate</b><span>“Is that the only thing in the way?”</span></div>
    <div><b>Answer</b><span>With their words and their numbers.</span></div>
    <div><b>Confirm</b><span>“Does that settle it?” Then ask again.</span></div>
  </div>

  <section class="sec rv">
    <div class="k">The drill bank</div>
    <h2>Say your answer aloud first, then open the card.</h2>
  </section>
  <div class="drills rv">
    <details class="drill"><summary><span>“I need to think about it.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“That makes sense, it’s a real decision. Usually when someone says that, there’s one part they’re still unsure about. Is it the fit, the money or the timing?”</blockquote>
      <p>Then: “If we sorted that out, would you be ready to start today?” If they say “all of it,” ask which one matters most.</p>
    </div></details>
    <details class="drill"><summary><span>“It’s too expensive.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“That makes sense. Can I ask, too expensive compared with what?”</blockquote>
      <p>If it’s compared with a cheaper VA, go to the next card. If it’s compared with doing nothing, bring back their own numbers: $950 a month against the monthly cost of their time from the audit. Then ask whether Starter, paid monthly, makes it easier to begin.</p>
    </div></details>
    <details class="drill"><summary><span>“I can find a VA on Upwork for less.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“You can, no question. The question is what your last hire really cost once you add up the time spent finding them, getting them started, and replacing them. With us, the sourcing, vetting, matching, pay and support are included, and if it doesn’t work, we replace them free. What you’re paying for is a hire that works.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“I tried a VA before and it didn’t work.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Honestly, that’s the most common reason people end up on a call with us. What went wrong?”</blockquote>
      <p>Match the answer to the front that fixes it: wrong working style to the Signature; couldn’t do the work to testing for the role; became a second job to the two Success Managers; faded after a few weeks to watching the work for as long as they’re with us, and a free replacement.</p>
    </div></details>
    <details class="drill"><summary><span>“I don’t have time to get someone started.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“That’s exactly why Starter is fifteen hours, not forty. You hand off one column, not your whole week. The 90-Day Success Plan gives the first weeks a structure, and your Talent Success Manager runs the check-ins. Your part is showing them how you like it done. The rest is ours.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“Can I see a few candidates first?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“We don’t send a stack of resumes, on purpose. Sorting candidates is the work you came to us to avoid. We interview many and present one, matched to how you work, with the reasons written down. If they’re not right, the next person comes forward.”</blockquote>
      <p>Never present or describe a candidate before the search has opened.</p>
    </div></details>
    <details class="drill"><summary><span>“Can I try it for a week or two?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Starter is the trial, in a way: fifteen hours a week, three months. A professional needs a few weeks to learn your business properly, and the three months gives the 90-Day Success Plan room to work. And the risk sits with us: a free replacement if it isn’t right, and your deposit back if we never present anyone.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“What if they quit, or it doesn’t work out?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Then we replace them, free, for as long as you’re with us. Your fees pause while the seat is empty, and your Success Manager handles the handover so you’re not starting again.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“We already have a VA.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Good. What’s working with them, and what isn’t?”</blockquote>
      <p>Often the answer is the later column: work nobody owns yet. Sometimes it’s a fit problem, which is the exact problem we solve. Either way, listen first and offer the audit.</p>
    </div></details>
    <details class="drill"><summary><span>“I’d rather have someone local.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“That’s what our Specialist plan is for: a specialised professional hired locally in the US or Europe, still virtual, and sourced, vetted, prepared and supported by us like every other placement.”</blockquote>
      <p>Then ask what “local” would give them. If the answer is time-zone overlap, every Relève professional works US business hours.</p>
    </div></details>
    <details class="drill"><summary><span>“You’re quite new, aren’t you?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Relève started in January 2023 as Sage’s own practice. Since then we’ve worked with more than fifty founders and connected hundreds of candidates. Before that, Sage spent six years in recruiting, with over three hundred placements, and seven years as an executive assistant to CEOs. The website and app are newer: that’s the system we built from all of it.”</blockquote>
      <p>Never present Relève as brand new, and never invent clients or results to answer this.</p>
    </div></details>
    <details class="drill"><summary><span>“Is my information safe with someone overseas?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“It’s a fair question. Every professional signs an NDA and a confidentiality agreement, and their identity and right to work are verified before you ever meet them. You decide what they have access to, and you can change it any time.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“Can’t AI do most of this now?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Some of it, yes, and our professionals use AI tools every day. What AI can’t do is own the work: follow up with a client, notice what’s missing, make a judgment call when something goes sideways. You get a person who does that, and who uses AI to do it faster.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“I need to talk to my partner.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Of course. What do you think their first question will be?”</blockquote>
      <p>Answer it now so they can repeat your answer. Offer ten minutes with both of them, and book that time before you hang up. A follow-up with no date rarely happens.</p>
    </div></details>
    <details class="drill"><summary><span>“Now isn’t the right time. Maybe next quarter.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“What would be different next quarter?”</blockquote>
      <p>Bring back how long it has been like this and the three-month figure from the audit. Starter is built for a small start now, so help is in place when it gets busy. If they still want to wait, mention the open spots once, then agree a date to speak again.</p>
    </div></details>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>Find the one doubt underneath, answer it with their numbers, then ask again.</p></div>
</template>

<template id="t-followup" data-title="Follow-up, the step-up, and referrals." data-hook="A sale doesn’t end when the call does. The written audit, the follow-up, the move to Essential and the referral ask are all part of it, and each has its own moment." data-tease="Your numbers, and what they tell you.">
  <section class="sec rv">
    <div class="k">Within an hour of every call</div>
    <h2>Record it while it’s fresh.</h2>
    <ul class="dots">
      <li>Log the call on the lead’s page in the console, with their words: the cost they named, what went wrong before, why now.</li>
      <li>Move the prospect: call held, deciding, passed (with why), or onboarding sent.</li>
      <li>Fill the key points in the Audit Studio so the written audit can be drafted. Read every line before it goes.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">A maybe, or a no</div>
    <h2>Generous, short, and on a schedule.</h2>
  </section>
  <ol class="tl rv">
    <li><em>Within 24 hours</em><b>The written audit</b><span>Sent whatever they decided. It is a second dose of reciprocity, and a reason to come back.</span></li>
    <li><em>Day 2</em><b>One short note, one question</b><span>“Having slept on the audit, which column would you change?” Low pressure, and easy to answer.</span></li>
    <li><em>Day 7</em><b>Something useful</b><span>An insight or exercise tied to what they told you, with no ask attached.</span></li>
    <li><em>Day 21</em><b>A last, warm note</b><span>“Whenever the timing is right, the audit stands and so does the offer.” Then stop, and let The Relève Letter keep the relationship warm.</span></li>
  </ol>
  <p class="rv">Never “circling back,” “following up” or “checking in.” Every note carries something of value. Never a link into the app before they are a client.</p>

  <section class="sec rv">
    <div class="k">The step-up</div>
    <h2>Day 60: from Starter to Essential.</h2>
    <p>The move was planted in the audit. When you match a Starter client, choose a professional with room to go full time, so the move keeps the same person. That is the strongest reason to stay. Around day 60, the owner knows what relief feels like and the 15-hour cap is what holds it back. Losing what you already have weighs more than gaining something new, so “no gap” becomes the default.</p>
    <blockquote class="say">“You’re two months in, and <span class="v">their professional</span> has the first column running. Are you starting to bump up against the fifteen hours?”</blockquote>
    <blockquote class="say">“Your Starter term ends on <span class="v">date</span>. The next step is Essential: full time, the later column from your audit, at $2,500 a month. Shall I set that up now so there’s no gap?”</blockquote>
    <p>For an eLIVate Club member, check how the member discount applies before you quote the Essential price. It has not yet been decided for a move from Starter, so confirm it in writing.</p>
  </section>

  <section class="sec rv">
    <div class="k">Referrals</div>
    <h2>Ask when the relief is fresh.</h2>
    <p>The best moment to ask is when a client tells you something is going well. People like to share good news, and the people they know look like them.</p>
    <blockquote class="say">“I’m really glad to hear that. Who else do you know who’s buried in work that isn’t theirs? We send a $500 thank-you for any introduction we place.”</blockquote>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Send the audit, keep the follow-up generous, plant the step-up early, and ask for referrals when the news is good.</p></div>
</template>

<template id="t-numbers" data-title="Your numbers." data-hook="Selling gets better when you can see where it leaks. A few honest numbers, tracked every week, tell you exactly which step to work on next." data-tease="The final check, then your sign-off.">
  <section class="sec rv">
    <div class="k">The funnel</div>
    <h2>Six steps from a name to a client.</h2>
  </section>
  <div class="steps rv">
    <div class="step"><span class="n">1</span><b>Reached</b><span>Connection requests and InMails sent.</span></div>
    <div class="step"><span class="n">2</span><b>Accepted</b><span>Connections accepted.</span></div>
    <div class="step"><span class="n">3</span><b>Replied</b><span>Real replies to the first message.</span></div>
    <div class="step"><span class="n">4</span><b>Booked</b><span>Discovery calls booked.</span></div>
    <div class="step"><span class="n">5</span><b>Held</b><span>Calls that actually happened.</span></div>
    <div class="step"><span class="n">6</span><b>Signed</b><span>Onboarding completed and the search opened.</span></div>
  </div>

  <section class="sec rv">
    <div class="k">Reading the leaks</div>
    <h2>Where it drops tells you what to fix.</h2>
  </section>
  <dl class="facts rv">
    <dt>Few accept</dt><dd>Look at who you are reaching and at the connection note. Warm them first with a useful comment.</dd>
    <dt>Few reply</dt><dd>The first message is asking too much, or reads as a pitch. Make the question easier and more about their week.</dd>
    <dt>Replies, no calls</dt><dd>The ask is unclear or too big. Offer the audit as the reason to meet, and give two times.</dd>
    <dt>Calls, no-shows</dt><dd>Send the note the day before with one question, and make sure the booking confirmation is clear.</dd>
    <dt>Calls, no yes</dt><dd>Usually discovery: the cost wasn’t named, or a fit doubt was still open at the price. Listen back to where the second yes went missing.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">Your week</div>
    <h2>Targets come from Sage, reviews happen weekly.</h2>
    <p>Sage sets your weekly activity targets and reviews the numbers with you each week. Track them in the console as you go: every touch logged, every lead moved, every follow-up date set. We don’t use invented benchmarks, and we never trade quality for volume. Ten thoughtful messages to the right owners beat fifty to the wrong ones.</p>
    <ul class="dots">
      <li>Log every touch the same day.</li>
      <li>Clear “Follow up today” on the lead board every morning.</li>
      <li>Bring one call you want to improve to your weekly review.</li>
    </ul>
  </section>

  <div class="final rv">
    <h2>Sell it the way it deserves.</h2>
    <p class="script tag-img"><img src="/consider-it-handled-cream.png" alt="Consider it handled." width="2755" height="414" decoding="async"></p>
    <p>One check left, then your sign-off.</p>
  </div>
</template>
