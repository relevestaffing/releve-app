<template id="t-welcome" data-title="Welcome to Relève." data-hook="You have been chosen to work with Relève, and we are glad you are here. This training explains how working through Relève works, how to use the app, and what your days will look like, so you can start with confidence." data-tease="The people around you, and who to go to for what.">
  <section class="sec rv">
    <div class="k">What Relève is</div>
    <h2>We match skilled professionals with US business owners, and support both sides.</h2>
    <p>Relève places virtual professionals with founders and business owners in the United States. We find the right person for each role, prepare them for it, and then support the working relationship for as long as it lasts. The owner directs the daily work. Relève handles everything around it: your agreement, your pay, your check-ins, your time off, and your growth.</p>
    <p>Our name is French for “the relief shift”: the person who arrives to take over the watch. That is your role. When an owner hands something to you, they should be able to stop thinking about it.</p>
  </section>

  <div class="take rv"><span class="k">Our promise to clients</span><p>“Consider it handled.” You are the person who makes that true.</p></div>

  <section class="sec rv">
    <div class="k">How this training works</div>
    <h2>Fourteen short lessons, three checks, one sign-off.</h2>
    <p>The training has four parts and takes about an hour and a half. Parts two, three and four each end with a short check of five questions. You need four right to pass, and you can try again as many times as you like. At the end, you sign off that you have read it.</p>
    <p>Your place saves as you go, so you can stop and come back on any device. Your Talent Success Manager can see how far you have come, and is happy to answer any question it raises.</p>
  </section>

  <div class="start rv">
    <div class="start-h"><span class="k">Before you begin</span><b>Three small things</b></div>
    <ol>
      <li><em>Go in order</em>Each part builds on the one before it.</li>
      <li><em>Open the app beside it</em>When a lesson mentions a page in the app, open it and look. It will make much more sense.</li>
      <li><em>Write down your questions</em>Bring them to your first call with your Talent Success Manager.</li>
    </ol>
  </div>
</template>

<template id="t-people" data-title="The people around you." data-hook="Working through Relève means you are never on your own. There are three people around every placement, and each one has a clear job. Knowing who does what saves you time and worry." data-tease="How the relationship between you, Relève and your client works.">
  <dl class="facts rv">
    <dt>Your client</dt><dd>The business owner you work for each day. <b>They direct your daily work</b>: which tasks to do, in what order, and to what standard. They assign tasks in the app and review your finished work.</dd>
    <dt>Your Talent Success Manager</dt><dd><b>Your person at Relève.</b> They hold regular calls with you, coach you, answer questions about pay, approve your time off, read your reports, and help with anything that isn’t working.</dd>
    <dt>The Client Success Manager</dt><dd>The client’s person at Relève. They hold a monthly call with your client and adjust the role as the business changes. You won’t speak with them often, but they are on the same team as you.</dd>
    <dt>Relève</dt><dd>Sets the scope of your role and its regular work, pays you, reviews your performance, and supports the placement from start to finish.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">Who to go to</div>
    <h2>A quick guide.</h2>
  </section>
  <div class="cmp rv">
    <div><h4>Ask your client</h4><ul>
      <li>What a task needs, or when it is due</li>
      <li>Which of two tasks comes first</li>
      <li>Access to a tool or account for a task</li>
      <li>How they like something done</li>
    </ul></div>
    <div><h4>Ask your Talent Success Manager</h4><ul>
      <li>Anything about your pay, hours or time off</li>
      <li>Work that seems outside your role, or more hours than agreed</li>
      <li>A concern about how things are going with your client</li>
      <li>Anything you are unsure about, at any time</li>
    </ul></div>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>Your client directs the work. Your Talent Success Manager looks after you.</p></div>
</template>

<!-- ═════════ PART TWO · HOW IT WORKS ═════════ -->

<template id="t-status" data-title="You, Relève and your client." data-hook="Your relationship with Relève is simple once you see its shape. Here is what you are, what you are not, and how each placement is agreed." data-tease="How and when you are paid.">
  <section class="sec rv">
    <div class="k">Your status</div>
    <h2>You are an independent contractor working with Relève.</h2>
    <ul class="dots">
      <li><b>You are not an employee</b> of Relève, or of your client. You run your own work as a self-employed professional.</li>
      <li><b>You are free to work with others.</b> Your relationship with Relève is not exclusive. The one limit is that you never work with a Relève client outside Relève (lesson six explains this).</li>
      <li><b>Never tell anyone you are an employee</b> of Relève or of your client, and never sign anything on their behalf.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">How a placement is agreed</div>
    <h2>An offer, then your yes.</h2>
  </section>
  <div class="steps rv">
    <div class="step"><span class="n">1</span><b>The offer</b><span>Relève sends you an offer in the app: the role, the hours, the scope, the start date and your pay.</span></div>
    <div class="step"><span class="n">2</span><b>Your decision</b><span>You accept or decline it in your account. It is always your choice.</span></div>
    <div class="step"><span class="n">3</span><b>The placement</b><span>Once accepted, it becomes your placement. Its details sit alongside your agreement.</span></div>
  </div>

  <section class="sec rv">
    <div class="k">Who decides what</div>
    <h2>The client directs the daily tasks. Relève sets the role around them.</h2>
    <p>Relève agrees the scope of your role and its regular work with the client, for example a standing schedule of posts each week. Within that scope, your client decides what to do each day and how urgent it is. Your client does not set your pay or review your performance on Relève’s behalf: your Talent Success Manager does that. If a client asks for something well outside your role, talk to your Talent Success Manager rather than refusing or arguing.</p>
    <p>Relève can’t promise a set amount of work, and a placement can end. If one does, we may offer you another.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Self-employed, free to work with others, and supported by Relève in every placement.</p></div>
</template>

<template id="t-pay" data-title="How you are paid." data-hook="Your pay comes from Relève, every month, on a fixed amount. Here is how it works, what you need to set up, and the one rule about pay you must always keep." data-tease="Your hours, time off and holidays.">
  <dl class="facts rv">
    <dt>Who pays you</dt><dd><b>Relève</b>, directly, from its own funds. Your client never pays you.</dd>
    <dt>How much</dt><dd><b>$7 an hour</b> for the hours your role is set at, unless your offer states a different rate. It is paid as a <b>fixed monthly amount</b> worked out from those hours: <b>$455</b> a month for 15 hours a week, <b>$758</b> for 25, <b>$910</b> for 30 and <b>$1,213</b> for 40. Your offer shows your hours and your exact monthly amount.</dd>
    <dt>When</dt><dd><b>Once a month.</b> Relève prepares your pay at the start of each month and sends it to the account you set up. Each payment appears on your pay page with the date and a reference.</dd>
    <dt>Where you set it up</dt><dd>On <b>Your pay</b> in the app. Choose your payout method early, so your first payment goes out on time.</dd>
    <dt>Tax forms</dt><dd>You complete a short tax residency question on the same page. Relève also needs a signed US tax form on file: a <b>W-8BEN</b> if you live outside the United States, or a W-9 if you live in it. Your Talent Success Manager will help you with it.</dd>
    <dt>Your taxes</dt><dd>As a self-employed professional, you report and pay your own taxes where you live. Relève does not take tax out of your pay.</dd>
    <dt>Your equipment</dt><dd>You provide your own computer, internet connection and workspace.</dd>
    <dt>Taking The Watch™</dt><dd>The paid work sample from your vetting is paid at $6 an hour for the time you spent, with your first month or once it has been scored.</dd>
  </dl>

  <div class="panel flag rv">
    <p><b>Pay stays private, in both directions.</b> Never discuss your pay with your client, and never ask what the client pays Relève. If a client asks about your pay, say kindly that pay is handled by Relève and they are welcome to ask their Client Success Manager.</p>
  </div>

  <section class="sec rv">
    <div class="k">A question about a payment</div>
    <p>Write to your Talent Success Manager in Messages. You will have a reply within one business day.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>$7 an hour, paid as a fixed amount once a month, from Relève. Set up your payout early, and keep pay private.</p></div>
</template>

<template id="t-hours" data-title="Hours, time off and holidays." data-hook="Your client is in the United States, and your hours follow theirs. Here is how many hours a role can be, how to ask for time off, and what to do when something unexpected happens." data-tease="The agreement, in plain words.">
  <dl class="facts rv">
    <dt>When you work</dt><dd><b>US business hours</b>, in the time zone written in your placement. Check it in your offer and your briefing.</dd>
    <dt>How many hours</dt><dd>Every role is set at <b>15, 25, 30 or 40 hours a week</b>, and your offer shows which. Those hours do not count approved time off or your local public holidays.</dd>
    <dt>Why they matter</dt><dd>Your hours are the size of the role, and your monthly pay is worked out from them.</dd>
    <dt>Extra hours</dt><dd>Never work extra hours or overtime without your Talent Success Manager agreeing first. If your client asks for more, tell your Talent Success Manager.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">Time off</div>
    <h2>Ask ahead, in the app.</h2>
    <ol class="nums">
      <li><b>Open Your placement</b> in the app and choose the first and last day away. Add a short note if it helps.</li>
      <li><b>Ask as early as you can.</b> The earlier you ask, the easier it is to arrange cover for your client.</li>
      <li><b>Relève decides and arranges cover</b> in the same step, and you will see the answer on the same page.</li>
      <li><b>Tell your client too</b>, once it is approved, so nothing surprises them.</li>
    </ol>
    <p>Let your Talent Success Manager know your local public holidays well in advance, so your client can plan around them.</p>
  </section>

  <section class="sec rv">
    <div class="k">When something unexpected happens</div>
    <h2>Say so early. That is always the right move.</h2>
    <p>If you are unwell, lose power or internet, or have an emergency, message your Talent Success Manager as soon as you can, and tell your client if you are able to. A short, early message is far better than a long explanation later. We would always rather know.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Work US hours, never add hours without approval, and ask for time off early.</p></div>
</template>

<template id="t-agreement" data-title="The agreement, in plain words." data-hook="You signed your Independent Contractor and Confidentiality Agreement in the app. This lesson explains the parts that shape your everyday work, in plain language. Your signed agreement is always the one that counts." data-tease="A five-question check on Part two.">
  <dl class="facts rv">
    <dt>Confidentiality</dt><dd>Everything you learn about your client’s business, customers and contacts, and about Relève’s systems and the Relève Signature™, stays private. Use it only for your work in an active placement, and never share it.</dd>
    <dt>Personal data</dt><dd>Handle people’s personal information only as your work needs. Never copy or store it outside the systems your client or Relève approves. If you think any data has been lost or seen by the wrong person, tell your Talent Success Manager <b>within 48 hours</b>, sooner if you can.</dd>
    <dt>AI tools</dt><dd>Only put your client’s information into an AI tool your client has approved, and <b>never into a tool that uses what you type to train its models</b>.</dd>
    <dt>Your device</dt><dd>Work on a device you control. Keep it updated, lock it when you step away, use two-step sign-in where your client offers it, never share a client’s passwords or accounts, and never work on client matters from a shared or public computer.</dd>
    <dt>Your work</dt><dd>Everything you create for your client belongs to your client. Relève’s training, scripts and systems belong to Relève.</dd>
    <dt>Working directly</dt><dd>During a placement, and for <b>12 months after it ends</b>, you may not work for or be paid by that client outside Relève. Breaking this means paying Relève twelve months of your monthly rate. It applies only to clients Relève introduced you to.</dd>
    <dt>Ending a placement</dt><dd>Either you or Relève can end a placement with <b>30 days’ written notice</b>. It can end at once for a serious breach, such as sharing confidential information. You are always paid for the work you did up to the last day.</dd>
  </dl>

  <div class="panel flag rv">
    <p><b>If a client ever asks you to work with them directly</b>, outside Relève, thank them and tell your Talent Success Manager. It happens, and it is never held against you for saying so.</p>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>Keep it private, keep it secure, and keep every client relationship through Relève.</p></div>
</template>
