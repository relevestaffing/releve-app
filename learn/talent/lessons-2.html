<!-- ═════════ PART THREE · THE APP ═════════ -->

<template id="t-setup" data-title="Your account and setup." data-hook="The Relève app is where your work lives: your tasks, your messages, your reports and your pay. This lesson covers signing in, putting it on your phone, and the setup checklist." data-tease="How work moves between you and your client, step by step.">
  <section class="sec rv">
    <div class="k">Signing in</div>
    <h2>No password. A link, by email.</h2>
    <p>Go to app.relevestaffing.com and enter the email address Relève has on file for you. We email you a sign-in link. Open it on the same device, and you are in.</p>
  </section>

  <section class="sec rv">
    <div class="k">On your phone</div>
    <h2>Add it to your home screen, and turn on notifications.</h2>
    <ol class="nums">
      <li><b>iPhone:</b> open the app in Safari, tap Share, then “Add to Home Screen.” Open it from the new icon and tap Enable notifications.</li>
      <li><b>Android:</b> open the app in Chrome, tap the menu, then “Install app” or “Add to Home screen,” and allow notifications.</li>
    </ol>
    <p>Notifications tell you the moment a client assigns a task, sends a message or reviews your work.</p>
  </section>

  <section class="sec rv">
    <div class="k">Your setup checklist</div>
    <h2>Your dashboard always shows what is next.</h2>
  </section>
  <dl class="facts rv">
    <dt>Verify who you are</dt><dd>Upload your identity document. It is never shown to a client.</dd>
    <dt>Sign your agreement</dt><dd>Read and sign your Independent Contractor and Confidentiality Agreement.</dd>
    <dt>Working with Relève</dt><dd>This training.</dd>
    <dt>Talent Signature™</dt><dd>Our assessment of how you work, about 20 to 25 minutes. Every match starts from it.</dd>
    <dt>Your skills</dt><dd>Every kind of work you do well, broken down in detail.</dd>
    <dt>Taking The Watch™</dt><dd>A paid, real day of work in each skill you choose.</dd>
    <dt>Availability</dt><dd>The hours you are free for calls and interviews.</dd>
    <dt>Profile, photo and video</dt><dd>What a client reads and sees first: your introduction, a clear photo, and a short video in your own voice.</dd>
    <dt>How you are paid</dt><dd>Your payout method and tax question.</dd>
  </dl>

  <div class="cmp rv">
    <div><h4>What a client can see</h4><ul>
      <li>Your profile, photo and introduction video</li>
      <li>Your Signature Match with them, written by Relève</li>
      <li>Your tasks, messages to them, and any highlight you choose to share</li>
    </ul></div>
    <div><h4>What a client never sees</h4><ul>
      <li>Your identity documents</li>
      <li>Your pay</li>
      <li>Your daily log, your end of week reports and your concerns</li>
      <li>Anything you tell your Talent Success Manager</li>
    </ul></div>
  </div>

  <section class="sec rv">
    <div class="k">Ask Relève</div>
    <p>The ASK RELÈVE button on every page answers questions about the app, your checklist, Taking The Watch, verification, and how pay works. For anything about your own rate or pay dates, ask your Talent Success Manager.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Sign in by email link, keep the app on your phone, and follow your checklist.</p></div>
</template>

<template id="t-tasks" data-title="Tasks: how work moves." data-hook="Most of your day runs through the Tasks page. Your client assigns work there, you move it forward, and they review it when it is done. Here is how each step works." data-tease="Where to talk with your client and Relève, and your client’s briefing.">
  <section class="sec rv">
    <div class="k">How your list is ordered</div>
    <h2>Most urgent first.</h2>
    <p>Your task list reads from top to bottom by urgency: overdue, sent back to you, due today, this week, later, and no date. Start at the top.</p>
  </section>

  <div class="steps rv">
    <div class="step"><span class="n">1</span><b>Assigned</b><span>Your client adds a task with details, a priority and a date. You get an email and a notification.</span></div>
    <div class="step"><span class="n">2</span><b>Seen</b><span>The moment you open your list, the task is marked seen. Your client sees “Seen by” you, with the time.</span></div>
    <div class="step"><span class="n">3</span><b>In progress</b><span>Move it to In progress when you start, so your client knows it is moving.</span></div>
    <div class="step"><span class="n">4</span><b>Sent for review</b><span>When you finish a task your client gave you, it goes to them for review. Your own tasks close as soon as you finish them.</span></div>
    <div class="step"><span class="n">5</span><b>Accepted, or sent back</b><span>Your client accepts it in one click, or sends it back with a note. A task sent back rises to the top of your list.</span></div>
  </div>

  <section class="sec rv">
    <div class="k">Useful tools on every task</div>
    <ul class="dots">
      <li><b>Ask a question.</b> Moves the task to “Waiting on you” for your client and emails them. Use it instead of guessing.</li>
      <li><b>Comments.</b> Keep the conversation about a task on the task itself, so nothing gets lost.</li>
      <li><b>Files.</b> Attach briefs, spreadsheets or finished work, up to 6 MB each.</li>
      <li><b>A time, and repeat weekly.</b> Recurring work, like a weekly report, can repeat. When you finish it, next week’s copy appears.</li>
      <li><b>Add to Google Calendar.</b> One click puts a dated task in your calendar.</li>
      <li><b>Your own tasks.</b> Add tasks for yourself too. They are marked as yours.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">When a task runs late</div>
    <p>A task past its date moves to the top in red, and the app sends you one quiet reminder. If it is still open two days later, the Relève team sees it. If you can’t meet a date, tell your client before it passes, with a new date you can keep. That is always better than missing it silently.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Open your list, move each task forward, ask when unsure, and never let a date pass quietly.</p></div>
</template>

<template id="t-messages" data-title="Messages and your briefing." data-hook="Two pages keep you connected and informed: Messages, where you talk with Relève and your client, and Your briefing, where your client tells you how they work." data-tease="Two short reports that keep Relève close to your work.">
  <dl class="facts rv">
    <dt>Messages</dt><dd>Your thread with your Talent Success Manager, and direct messages with your client. You are emailed when a new message arrives. Reply within your working hours, and the same day whenever you can.</dd>
    <dt>Your briefing</dt><dd>Your client’s tools, the access you will need, and their preferences: how they like updates, what they never want you to do, and how they like things done. <b>Read it before your first day</b>, and again whenever it changes.</dd>
    <dt>Your placement</dt><dd>Who you work for and since when, your time off and cover, and your Success Plan.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">Where to say what</div>
    <h2>The right conversation in the right place.</h2>
    <ul class="dots">
      <li><b>About a specific task:</b> comment on the task, or use Ask a question.</li>
      <li><b>General updates for your client:</b> a direct message.</li>
      <li><b>Pay, hours, time off, scope or any worry:</b> your Talent Success Manager in Messages.</li>
      <li><b>Something urgent:</b> message your Talent Success Manager and say it is urgent in the first line.</li>
    </ul>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Read your briefing first, and keep each conversation where it belongs.</p></div>
</template>

<template id="t-reports" data-title="Your daily log and end of week report." data-hook="Two short reports keep Relève close to your work. They take a few minutes, they protect you, and they show your client the value you bring." data-tease="A five-question check on Part three.">
  <section class="sec rv">
    <div class="k">Every day · about two minutes</div>
    <h2>The daily log.</h2>
  </section>
  <dl class="facts rv">
    <dt>Hours today</dt><dd>How long you worked.</dd>
    <dt>What you finished</dt><dd>The work completed, in one or two lines.</dd>
    <dt>Anything blocking you</dt><dd>Private to Relève. For example, “Waiting on access to the finance drive.”</dd>
    <dt>One highlight</dt><dd>Optional. You choose whether to share it with your client. Shared highlights appear in their monthly report.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">Every Friday</div>
    <h2>The end of week report.</h2>
    <p>Hours worked this week, the tasks you completed, a win from the week, and any concerns. It goes to Relève, never to your client. A concern is seen by the team straight away, so this is a safe place to say if something isn’t right.</p>
  </section>

  <div class="cmp rv">
    <div><h4>Too vague</h4><ul>
      <li>“Did emails and some admin.”</li>
      <li>“Busy week.”</li>
      <li>“No concerns” when there is one</li>
    </ul></div>
    <div><h4>Clear and useful</h4><ul>
      <li>“Cleared the inbox to zero, sent six proposal follow-ups, booked three client calls for Tuesday.”</li>
      <li>Win: “Found a double charge on the software bill and got it refunded.”</li>
      <li>Concern: “Asked to cover evening hours twice this week, outside our agreed time.”</li>
    </ul></div>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>Log every day, report every Friday, and always be honest about concerns.</p></div>
</template>

    <li><em>Before day one</em><b>Prepare</b><span>Read your briefing. Set up every tool and access it lists, and test each one. Check your client’s time zone and your working hours. Make sure your payout is set up.</span></li>

  <div class="take rv"><span class="k">Hold on to this</span><p>Prepare before day one, learn fast in the first weeks, and use your calls well.</p></div>

<template id="t-day" data-title="A good day, and a good week." data-hook="The professionals clients value most are predictable in the best way: they start the same way, update the same way, and finish the same way. Here is a rhythm that works." data-tease="Working well with an executive.">
  <section class="sec rv">
    <div class="k">A good day</div>
  </section>
  <ol class="tl rv">
    <li><em>Start of day</em><b>Open the app</b><span>Check your tasks from the top, read new messages, and look at today’s calendar. If your client likes it, send a short good-morning note with your plan for the day.</span></li>
    <li><em>During the day</em><b>Move work forward</b><span>Work from the top of the list. Move tasks to In progress as you start them, send them for review as you finish them, and ask questions as soon as you need to.</span></li>
    <li><em>Through the day</em><b>Keep your client informed</b><span>A short update when something important is done, and an early warning if something is going to be late.</span></li>
    <li><em>End of day</em><b>Close the loop</b><span>Note where each open task stands, and file your daily log. If your client likes an end-of-day summary, send it.</span></li>
  </ol>

  <section class="sec rv">
    <div class="k">A good week</div>
  </section>
  <dl class="facts rv">
    <dt>Every day</dt><dd>Tasks moved forward, messages answered, daily log filed.</dd>
    <dt>Recurring work</dt><dd>The standing work of your role done on schedule, such as the weekly posts, the inbox kept clear, or the Monday report.</dd>
    <dt>Weekly or biweekly</dt><dd>Your call with your Talent Success Manager.</dd>
    <dt>Friday</dt><dd>Your end of week report.</dd>
  </dl>

  <div class="take rv"><span class="k">Hold on to this</span><p>Start the same way, update the same way, finish the same way, every day.</p></div>
</template>

<template id="t-exec" data-title="Working with an executive." data-hook="Your client is busy and their time is valuable. The best support anticipates what they need, communicates clearly, and takes work off their mind, not just off their list." data-tease="Standards, feedback, and getting help.">
  <section class="sec rv">
    <div class="k">Anticipate</div>
    <h2>Think one step ahead.</h2>
    <p>If a meeting is booked, prepare the agenda and the documents before they ask. If a client replies with a question, have the answer ready. Notice patterns: what they ask for every week, what they always forget, what slows them down. Then handle it before it becomes a request.</p>
  </section>

  <section class="sec rv">
    <div class="k">Communicate clearly</div>
    <h2>Short, complete, and easy to act on.</h2>
    <p>A simple update shape your client can read in ten seconds:</p>
    <blockquote class="say">“Done: the proposal is sent and the follow-up is scheduled for Thursday. In progress: the travel options, ready by 3 pm. Need from you: a yes or no on the venue by tomorrow.”</blockquote>
    <ul class="dots">
      <li><b>Ask good questions.</b> Group small questions into one message, and suggest an answer: “I’d book the 10 am flight unless you’d prefer later.”</li>
      <li><b>Confirm what you heard.</b> “To confirm, you want the report by Friday, in the usual format.”</li>
      <li><b>Write well.</b> Full sentences, a friendly tone, and a check for spelling before you send anything in your client’s name.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">When something goes wrong</div>
    <h2>Tell them fast, fix it, and prevent it.</h2>
    <ol class="nums">
      <li><b>Say it early:</b> “I sent the invoice to the wrong address. I have already sent it to the right one.”</li>
      <li><b>Fix what you can</b> before or as you tell them.</li>
      <li><b>Explain how it won’t happen again:</b> “I now check the address against the client list before sending.”</li>
    </ol>
    <p>Everyone makes mistakes. Clients trust people who own them quickly.</p>
  </section>

  <section class="sec rv">
    <div class="k">Using AI well</div>
    <p>AI tools can help you draft, summarise and organise faster, and clients appreciate it. Use only the tools your client has approved, never put confidential information into a tool that trains on what you type, and always check the result yourself before it goes anywhere. You own the work, and AI is a helper.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Anticipate, communicate in a way they can act on, and own every mistake quickly.</p></div>
</template>

<template id="t-standards" data-title="Standards, feedback and getting help." data-hook="The last lesson. These are the standards that make clients trust Relève professionals, how your work is reviewed, and what to do when something isn’t right." data-tease="The final check, then your sign-off.">
  <section class="sec rv">
    <div class="k">Our standards</div>
    <h2>What every Relève professional keeps to.</h2>
    <ul class="dots">
      <li><b>Responsive:</b> reply to your client and to Relève within your working hours, and the same day whenever you can.</li>
      <li><b>Reliable:</b> do what you said, when you said. If a date will slip, say so before it does.</li>
      <li><b>Careful:</b> check your work before you send it, especially anything sent in your client’s name.</li>
      <li><b>Discreet:</b> client information stays private, always.</li>
      <li><b>Secure:</b> your device locked and updated, client passwords never shared.</li>
      <li><b>Professional:</b> warm, calm and respectful, even on a hard day.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">How your work is reviewed</div>
    <dl class="facts">
      <dt>Feedback</dt><dd>Written feedback on the quality of your work, your communication and your ownership, with your strengths and what to build on.</dd>
      <dt>Performance reviews</dt><dd>Your Talent Success Manager reviews your work against the agreed scope of your role.</dd>
      <dt>The six-month review</dt><dd>A look back at how the placement is going, for you and for your client.</dd>
    </dl>
  </section>

  <section class="sec rv">
    <div class="k">When something isn’t right</div>
    <h2>Go to your Talent Success Manager. Always.</h2>
    <ul class="dots">
      <li>Your client asks for work well outside your role, or more hours than agreed.</li>
      <li>Your client’s tone or expectations worry you.</li>
      <li>You are struggling with the workload, a tool, or anything at home that affects work.</li>
      <li>You want to end a placement. This needs 30 days’ notice, and your Talent Success Manager will help.</li>
    </ul>
    <p>Never argue with a client, and never quietly carry a problem alone. Raising a concern is never held against you. It is how we keep placements working for everyone.</p>
  </section>

  <div class="final rv">
    <h2>Take the watch.</h2>
    <p class="script tag-img"><img src="/consider-it-handled-cream.png" alt="Consider it handled." width="2755" height="414" decoding="async"></p>
    <p>One check left, then your sign-off.</p>
  </div>
</template>
