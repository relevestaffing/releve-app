<template id="t-signature" data-title="The Relève Signature™ and the disciplines." data-hook="This is Relève’s own work, and the main reason our matches hold. You won’t score it yourself, but you do need to explain it simply and accurately." data-tease="Why we present one candidate, and the rules every release follows.">
  <div class="cmp rv">
    <div><h4>The Executive Signature</h4><ul>
      <li>58 screens, about 12 to 16 minutes</li>
      <li>How the owner leads, decides and communicates</li>
      <li>Ends in an archetype: Architect, Conductor, Catalyst, Strategist, Steward or Principal</li>
    </ul></div>
    <div><h4>The Talent Signature</h4><ul>
      <li>94 screens, about 20 to 25 minutes</li>
      <li>How the professional works, takes direction and handles pressure</li>
      <li>Ends in an archetype: Anticipator, Steady Hand, Executor, Systemizer, Diplomat or Second</li>
    </ul></div>
  </div>

  <section class="sec rv">
    <div class="k">What it measures</div>
    <h2>Three layers, weighted by what makes a fit last.</h2>
  </section>
  <dl class="facts rv">
    <dt>Working style · 65%</dt><dd><b>Tempo, Direction, Cadence, Candor, Initiative, Structure.</b> Direction and Initiative carry the most weight: does the owner give direction the way this person takes it, and does this person take initiative the way the owner wants?</dd>
    <dt>Disposition · 35%</dt><dd><b>Composure, Warmth, Rigor, Adaptability, Assertion, Drive.</b> Drive is measured but never scored. The team uses it privately to look after retention.</dd>
    <dt>Conditions · checked</dt><dd>Hours overlap, volume, discretion, the mix of work, tools, and what the owner will never delegate.</dd>
    <dt>Validity</dt><dd>Attention checks, consistency pairs, and answers that are too fast or too uniform. Each result is Valid, Review or Invalid. Clients see only a verified badge and confidence bands, never the checks.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">The disciplines</div>
    <h2>The Signature asks whether they will get on. The disciplines ask whether they can do the job.</h2>
    <p>Neither answers the other’s question, and we need both. The owner picks what the role is made of from twelve disciplines. Each one opens twelve competencies, marked must-have, nice-to-have or not needed. The professional rates themselves on the same list, so the two compare directly.</p>
    <ul class="tokens">
      <li>Executive assistance</li><li>Social media &amp; content</li><li>Bookkeeping &amp; finance</li><li>Customer support &amp; success</li>
      <li>Sales &amp; CRM</li><li>Operations &amp; project management</li><li>Marketing &amp; campaigns</li><li>Recruiting &amp; people operations</li>
      <li>Data, research &amp; reporting</li><li>Design &amp; creative</li><li>Personal &amp; household</li><li>Technical &amp; systems</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">Explaining it to a client</div>
    <blockquote class="say">“You and your candidate both take a short assessment of how you like to work. We match on that, and on what the role actually needs, so the fit is designed before you ever meet.”</blockquote>
    <ul class="dots">
      <li>Call it a working style and personality assessment, never a “personality test.”</li>
      <li>Never share one person’s results with anyone outside the team.</li>
      <li>Write the names with the mark: the Relève Signature™ and Taking The Watch™.</li>
    </ul>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>The Signature: will they get on. The disciplines: can they do it. We need both.</p></div>
</template>

<template id="t-matching" data-title="Matching: one candidate, approved by name." data-hook="Other agencies send a shortlist and let the owner sort it. We do the sorting ourselves and present one person. That single choice shapes how we match, approve and present every candidate." data-tease="Who does what once a placement starts, and the weekly rhythm behind it.">
  <section class="sec rv">
    <div class="k">Why one</div>
    <h2>A shortlist hands the hardest part back to the owner.</h2>
    <p>Sorting candidates is exactly the work the owner came to us to avoid. One candidate, ready for a yes or a no, is what “handled” means at this stage. Behind the scenes we interview many people. In front of the owner there is only ever one.</p>
  </section>

  <div class="steps rv">
    <div class="step"><span class="n">1</span><b>Rank</b><span>The roster is ranked against the owner’s Signature and role, with capability and fit scored separately.</span></div>
    <div class="step"><span class="n">2</span><b>Approve</b><span>A named person approves the release and writes a note, in our words, on why this person. The app records who approved it and when.</span></div>
    <div class="step"><span class="n">3</span><b>Present</b><span>The owner sees one candidate, the Signature Match, the competency read and the intro video.</span></div>
    <div class="step"><span class="n">4</span><b>Decide</b><span>The owner approves or declines, with a reason. A decline brings the next person forward.</span></div>
  </div>

  <section class="sec rv">
    <div class="k">The rules of a release</div>
    <h2>Enforced by the app, not by memory.</h2>
    <ul class="dots">
      <li>Nothing is sent without a named approval. The app refuses a release without one.</li>
      <li>An owner sees one candidate at a time. A second release waits its turn.</li>
      <li>Unverified talent can’t be released. The database refuses it.</li>
      <li>A decline always asks why, and the answer shapes the next match.</li>
      <li>The candidate is never told an owner declined them.</li>

  </section>

  <section class="sec rv">
    <div class="k">Writing the approval note</div>
    <h2>The first thing the owner reads.</h2>
    <p>Write it the way you would explain the choice across a table: a sentence or two, tied to something the owner told us. A worked example:</p>
  </section>
  <div class="cmp rv">
    <div><h4>Too general</h4><ul><li>“Maria is a great fit with strong skills and lots of relevant experience.”</li></ul></div>
    <div><h4>Specific, and tied to the owner</h4><ul><li>“You told us updates matter most. Maria sends an end-of-day summary without being asked, and she ran a coach’s calendar for three years.”</li></ul></div>

  <div class="take rv"><span class="k">Hold on to this</span><p>We interview many. They meet one.</p></div>

<template id="t-running" data-title="Running a placement." data-hook="The placement is where the real work starts. This is the rhythm that keeps a client feeling handled in the first month, the sixth month and the second year." data-tease="What clients, talent and the team each see in the app.">

    <ul class="dots">
      <li>A task two days past its date reaches the team. Follow up that day.</li>
      <li>A concern on an end of week report or a check-in needs a closer look. Read it, call, and log what you did.</li>
