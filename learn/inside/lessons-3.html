<template id="t-voice" data-title="How we sound." data-hook="Every word we write or say is part of the product. Our voice is how an owner decides, before any call, whether we understand their week." data-tease="Every way an owner finds Relève, and the rules for reaching out.">
  <section class="sec rv">
    <div class="k">The voice</div>
    <h2>An experienced operator, writing to a peer.</h2>
    <p>Calm, exact, warm, a little contrarian, and generous with what we know. Plain words and complete sentences. Specific nouns from real work: the inbox at 11 pm, the lead that waited two days, the invoice nobody sent. Arithmetic the reader can check for themselves. Relève itself appears late and lightly.</p>
  </section>

  <div class="cmp rv">
    <div><h4>We say</h4><ul>
      <li>Prepared for your role</li>
      <li>Supported, handled (for the professional)</li>
      <li>Fully managed (for the service as a whole)</li>
      <li>Virtual, every time we describe the service</li>
      <li>Followed up with, reminded</li>
      <li>Needs a closer look</li>
      <li>Consider it handled</li>
    </ul></div>
    <div><h4>We never say</h4><ul>
      <li>Trained, or managed, about the professional</li>
      <li>Cheaper, 70% cheaper, 30% of the cost, or any cost claim</li>
      <li>Chase, flagged, gone quiet</li>
      <li>Shortlist</li>
      <li>“Only ten clients a year” in any email, post, letter or follow-up</li>
      <li>Leverage, streamline, optimize, seamless, utilize, elevate, unlock, journey</li>
    </ul></div>
  </div>

  <section class="sec rv">
    <div class="k">Writing like a person</div>
    <h2>Read every line aloud before it goes out.</h2>
    <ul class="dots">
      <li>No em dashes. Use a comma, a full stop or a colon.</li>
      <li>No “it’s not this, it’s that” constructions.</li>
      <li>No emoji, and no openers that clear their throat, such as “Here’s the thing” or “Let me explain.”</li>
      <li>No invented numbers, clients, results, quotes or testimonials. Ever.</li>
      <li>Read each line as if you were saying it across a table to one owner. Rewrite anything a person wouldn’t say that way.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">Who signs what</div>
    <h2>We write as Relève.</h2>
    <ul class="dots">
      <li>Everything goes out as Relève, from hello@relevestaffing.com, never under a personal name. The one exception is The Relève Letter, our email to the list, which Sage writes in the first person.</li>
      <li>Sage Jackson is Relève’s founder. Never name anyone else as the founder.</li>
      <li>Everything Relève runs through Relève accounts. Never a personal email, sign-in or test account.</li>
      <li>Say “virtual” whenever you describe the service. “Executive staffing” on its own sounds local.</li>
      <li>Prices appear on the website and landing pages only, never in a social post.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">The look</div>
    <h2>The brand, at a glance.</h2>
    <p>Deep fern green, cream and paper, with silver as the only metal, never gold. Lora for headlines, Poppins for text. The logo is always the real artwork file, never typed in a font, and “Consider it handled.” appears only as its script image. Anything visual goes through the Relève Design Standard, and anything written goes through the Relève Content Standard, before anyone outside the team sees it.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>If a line could have come from any agency, it isn’t finished.</p></div>
</template>

<template id="t-leads" data-title="Where clients come from." data-hook="We don’t buy attention. We earn it, mostly on LinkedIn, by being useful before we ask for anything. Here is every way an owner finds Relève, and what happens next." data-tease="The discovery call, minute by minute.">

  <section class="sec rv">
    <div class="k">The opening line</div>

  </section>

  <section class="sec rv">
    <div class="k">Rules for reaching out</div>
    <h2>Low pressure, and always useful.</h2>
    <ul class="dots">
      <li>Lead with the fear, never with price or a task list. Most founders aren’t worried about finding a VA. They’re worried about handing real work to someone and ending up managing them.</li>
      <li>One message, one ask: thirty minutes to see if it fits.</li>
      <li>Never promise a candidate, a match or a start date before the call.</li>
      <li>Answer a no kindly, and mention the referral thank-you.</li>
      <li>Sales emails should read as “we’re here to help,” never as a push.</li>
      <li>Never link a prospect into the app.</li>
    </ul>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Be useful first. The call comes from the help, never from the pitch.</p></div>

<template id="t-call" data-title="The discovery call." data-hook="Thirty minutes that decide almost everything. The owner talks, you listen, you audit their week together, and if it fits they leave on Starter with the move to Essential already planned. Sage runs these calls today. Everyone on the team should know how they work." data-tease="Every common objection, and how to answer it.">
  <div class="ruler rv">
    <div style="flex:3"><b>0:00</b>Frame</div>
    <div style="flex:9"><b>3:00</b>Discovery</div>
    <div style="flex:5"><b>12:00</b>Live audit</div>
    <div style="flex:5"><b>17:00</b>Why Relève</div>
    <div style="flex:4"><b>22:00</b>The offer</div>
    <div style="flex:4"><b>26:00</b>Close</div>
  </div>

  <section class="sec rv">
    <div class="k">The first real question</div>
    <blockquote class="say">“What happened the last time you handed work to someone?”</blockquote>
    <p>Everything on the call hangs off the answer. Their fear is rarely the price or where the talent lives. It is whether they can trust the person, and whether that person becomes a second job. Get them to say it early, so you can answer it later instead of defending against it at the end.</p>
  </section>

  <section class="sec rv">
    <div class="k">Three yeses, in this order</div>
    <ol class="nums">
      <li><b>Yes, this is costing me.</b> They name the cost in their own words during discovery.</li>
      <li><b>Yes, this would fix it.</b> The trial close at the end of Why Relève.</li>
      <li><b>Yes, start now.</b> Only after the first two. If the third stalls, one of the first two is missing.</li>
    </ol>
    <p>Talk for about a fifth of the call. Whenever you feel the urge to explain, ask the next question instead.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>They name the cost. You show the arithmetic. They choose the start.</p></div>

  <section class="sec rv">
    <div class="k">Phase by phase</div>
    <h2>Open each phase for the lines that matter.</h2>
  </section>
  <div class="acc rv">
    <details><summary>Frame · 0:00 to 3:00<i></i></summary><div class="a">
      <p>Take the lead, say what the thirty minutes are for, and agree on a clear answer at the end.</p>
      <blockquote class="say">“I’ll ask about the business and where your time goes. Then we’ll do a live audit together: what comes off your plate first, and what it’s worth. If it looks like a fit, I’ll show you how Relève works and what it costs. If it isn’t, I’ll tell you, and you keep the audit either way. Sound fair?”</blockquote>
      <blockquote class="say">“At the end I’ll ask whether you want to get started. Yes is great and no is completely fine. All I ask is that you tell me which, so neither of us is left guessing.”</blockquote>
      <p>Wait for an actual “okay.” You will come back to it in the close.</p>
    </div></details>
    <details><summary>Discovery · 3:00 to 12:00<i></i></summary><div class="a">
      <p>Go in this order: where they are, what went wrong before, what it is costing, where they want to be, and why now. Write their answers down word for word.</p>
      <ul class="dots">
        <li>“Roughly where is revenue each month?” “How many hours are you working in a normal week?”</li>
        <li>“What happened the last time you handed work to someone?” “What would you need to see to trust someone with it again?”</li>
        <li>“Of your hours, how many are work only you can do, and how many could someone else do if you trusted them?”</li>
        <li>“If nothing changes, what do the next six months look like?”</li>
        <li>“Ninety days from now, what’s different about your week?” “What made you book this call this week?”</li>
      </ul>
      <p>Then say it back in their words, and finish with “Did I miss anything?”</p>
    </div></details>
    <details><summary>Live audit · 12:00 to 17:00<i></i></summary><div class="a">
      <p>Share your screen and sort their week into three columns: <b>keep</b> (only they can do it), <b>first</b> (up to 15 hours, the most repetitive and painful), and <b>later</b> (everything else that isn’t theirs). Then do the arithmetic out loud with their numbers, using the calculator below. Finish by planting the next step: “The later column is usually when owners want someone full time.”</p>
    </div></details>
    <details><summary>Why Relève · 17:00 to 22:00<i></i></summary><div class="a">
      <p>Answer the fear they named. Explain why their last hire failed, usually the right resume and the wrong working style, so the blame comes off them. Then give Sage’s background in two sentences, walk the six fronts in one sentence each (spending longer on the one that answers their story), and explain the two Success Managers.</p>
      <blockquote class="say">“Thinking about what happened with your last hire, does this fix the part that went wrong?”</blockquote>
      <p>Anything less than a clear yes: “Which part doesn’t fit yet?” Settle it here. Never move to price with a doubt still open.</p>
    </div></details>
    <details><summary>The offer · 22:00 to 26:00<i></i></summary><div class="a">
      <p>Ask first: “Would it help if I walked you through how clients start with us?” Then give Specialist at $4,500 and Essential at $2,500, and recommend Starter at $950 for their first column. Be honest about what Starter leaves out: it includes general preparation, and preparation for their specific role starts at Essential. Set up the move to Essential when the term ends.</p>
      <p>Stack it (a vetted, matched professional, two people on our side, the app, pay handled by us), then the guarantee: a qualified candidate within 14 days, up to two replacements, and the deposit back if we never present anyone. Then stop talking and let them speak first.</p>
    </div></details>
    <details><summary>The close · 26:00 to 30:00<i></i></summary><div class="a">
      <p>Give a true reason to start now: Relève opens <b>only 10 client spots per year</b>, because every placement is personally overseen. Quote the same taken count the website shows that day; prospects will have seen it. Then remind them their 14 days start when the search opens.</p>
      <blockquote class="say">“Would you rather start monthly at $950, or pay the three months up front and save $350?”</blockquote>
      <p>On a yes, send onboarding while you are still on the call and walk them through it. On a no, thank them, ask what made it a no, and say the written audit is coming anyway.</p>
    </div></details>
  </div>

  <div class="calc rv">
    <div class="calc-h"><span class="k">The live audit arithmetic</span><b>Type their numbers in as they talk</b></div>
    <div class="c-in">
      <label>Revenue a month<input id="a-rev" type="number" inputmode="numeric" value="40000" min="0" step="1000"></label>
      <label>Hours they work a week<input id="a-hrs" type="number" inputmode="numeric" value="55" min="1" step="1"></label>
      <label>Hours to hand off a week<input id="a-off" type="number" inputmode="numeric" value="15" min="0" step="1"></label>
    </div>
    <div class="res">
      <div><small>Their time, per hour</small><b id="a-hour">$168</b></div>
      <div><small>Those hours, per month</small><b id="a-month">$10,920</b></div>
      <div><small>Three months of waiting</small><b id="a-three">$32,760</b></div>
    </div>
    <p class="fine">Revenue divided by monthly hours gives their hourly value. The handoff hours times that value is what the work is costing them each month. Keep the three-month figure for the timing objection.</p>
  </div>

</template>

<template id="t-objections" data-title="Handling objections." data-hook="An objection is a question the owner hasn’t finished asking. Never argue with it. Find the real doubt underneath and answer that one." data-tease="What happens in the hour after the call, and how we use the CRM.">
  <div class="method rv">
    <div><b>Acknowledge</b><span>“That makes sense.” Never “but.”</span></div>
    <div><b>Isolate</b><span>“Is that the only thing in the way?”</span></div>
    <div><b>Answer</b><span>With their words and their numbers.</span></div>
    <div><b>Confirm</b><span>“Does that settle it?” Then ask again.</span></div>
  </div>

  <section class="sec rv">
    <div class="k">Practice</div>
    <h2>Say your answer out loud first, then open the card.</h2>
  </section>
  <div class="drills rv">
    <details class="drill"><summary><span>“I need to think about it.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“That makes sense, it’s a real decision. Usually when someone says that, there’s one part they’re still unsure about. Is it the fit, the money or the timing?”</blockquote>
      <p>Then: “If we sorted that out, would you be ready to start today?” Whatever they name, go to that objection.</p>
    </div></details>
    <details class="drill"><summary><span>“I can find a VA on Upwork for less.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“You can, no question. The question is what your last hire really cost once you add up the time spent finding them, getting them started, and replacing them. With us, the sourcing, vetting, matching, pay and support are included, and if it doesn’t work, we replace them. What you’re paying for is a hire that works.”</blockquote>
      <p>Then bring back their audit number: the monthly cost of their own time against $950.</p>
    </div></details>
    <details class="drill"><summary><span>“I tried a VA before and it didn’t work.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Honestly, that’s the most common reason people end up on a call with us. What went wrong?”</blockquote>
      <p>Match their answer to the front that fixes it. Wrong working style: the Signature. Couldn’t do the work: tested against the role. Became a second job: the two Success Managers. Faded after a few weeks: we watch the work for as long as they’re with us, and replace a hire who doesn’t work out.</p>
    </div></details>
    <details class="drill"><summary><span>“I don’t have time to get someone started.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“That’s exactly why Starter is fifteen hours, not forty. You hand off one column, not your whole week. The 90-Day Success Plan gives the first weeks a structure, and your Talent Success Manager runs the check-ins. Your part is showing them how you like it done. The rest is ours.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“I need to talk to my partner.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Of course. What do you think their first question will be?”</blockquote>
      <p>Answer that question now, so they can repeat your answer. Then offer ten minutes with both of them, and book the time before you hang up.</p>
    </div></details>
    <details class="drill"><summary><span>“Now isn’t the right time. Maybe next quarter.”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“What would be different next quarter?”</blockquote>
      <p>Bring back how long it has been like this, and the three-month figure from the audit. Starter is built for a small start now, so help is already in place when it gets busy. If they still want to wait, mention the open spots once, then agree a date to talk again.</p>
    </div></details>
    <details class="drill"><summary><span>“Is my information safe with someone overseas?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“It’s a fair question. Every professional signs an NDA and a confidentiality agreement, and their identity and right to work are verified before you ever meet them. You decide what they have access to, and you can change it any time.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“Can’t AI do most of this now?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“Some of it, yes, and our professionals use AI tools every day. What AI can’t do is own the work: follow up with a client, notice what’s missing, make a judgment call when something goes sideways. You get a person who does that, and who uses AI to do it faster.”</blockquote>
    </div></details>
    <details class="drill"><summary><span>“Why do you cost more than other agencies?”</span><i>Show the answer</i></summary><div class="a">
      <blockquote class="say">“We do cost more than some. Most agencies match on a resume and step back after the introduction. We study your business first, match on how you work, prepare the person for your role, and two people on our side support the placement for as long as you’re with us. If a hire doesn’t work out, we replace them.”</blockquote>
    </div></details>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>Acknowledge, isolate, answer, confirm. Then ask again.</p></div>
</template>

<template id="t-after" data-title="After the call, and the CRM." data-hook="Many decisions are made in the hour after a call. This is how we follow up, how we record it, and how a yes becomes a client without anything slipping." data-tease="A five-question check on Part four.">
  <div class="cmp rv">
    <div><h4>On a yes</h4><ul>
      <li>Confirm onboarding is done and the search is open</li>
      <li>Mark the prospect won in the console</li>
      <li>Send the written audit within 24 hours</li>
      <li>Make sure their Signature link has arrived. It is the most important thing they will do that week.</li>
    </ul></div>
    <div><h4>On a no, or a maybe</h4><ul>
      <li>Send the written audit anyway, within 24 hours</li>
      <li>Two days later, one short, low-pressure note with a single question</li>
      <li>Record why, in their words</li>
      <li>Set the next follow-up date</li>
    </ul></div>
  </div>

  <section class="sec rv">
    <div class="k">The CRM in the console</div>
    <h2>If it isn’t in the console, it didn’t happen.</h2>
    <ul class="dots">
      <li>Every lead lives on the lead board, from first touch to signed client, with an owner, a source, a stage and a next follow-up date.</li>
      <li>“Follow up today” leads the board every morning. A follow-up date in red is overdue.</li>
      <li>Log every touch: a call, an email, a message.</li>
      <li>Each lead has its own page with contact details, the history, documents and business audits.</li>
      <li>A booked discovery call puts the person in Directory under Prospects. From there they move to call held, deciding, passed (with why), or onboarding sent.</li>
      <li>Email buttons in the console open Gmail from hello@relevestaffing.com, never a personal account.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">The written audit</div>
    <h2>Read every line before it goes.</h2>
    <p>After the call, fill in a few key points on the lead’s page in the Audit Studio, and the console drafts the audit in the Relève format. Read it and edit it until every line sounds like us, then send the private link. Never send a draft you haven’t read.</p>
  </section>

  <section class="sec rv">
    <div class="k">Sending onboarding</div>
    <h2>The only door into the app.</h2>
    <p>Onboarding goes out from the console and carries the agreement and the deposit. Check the plan, the spelling of the name and the email address before you send it: the name on the agreement must match the name on their account.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>Follow up within the hour, record everything, and never let a yes wait.</p></div>
</template>

<template id="t-lines" data-title="The lines we never cross." data-hook="Each of these rules protects a client, a professional or Relève’s name. Several are enforced by the app itself. The rest are enforced by us." data-tease="How we work every day, and what to do when you’re not sure.">
  <ol class="rules rv">
    <li><b>Nobody enters the app without onboarding.</b><span>Only an onboarding email from Relève opens an account. Prospects and leads stay on the website.</span></li>
    <li><b>We meet everyone.</b><span>No professional is invited in without a screening call that has actually happened.</span></li>
    <li><b>Nothing reaches a client without a named approval.</b><span>Every candidate release carries a person’s name and a note.</span></li>
    <li><b>Pay stays private.</b><span>Clients never see talent pay and talent never see the client’s rate. Never share either in a message, a call or an email.</span></li>
    <li><b>Check-ins stay private.</b><span>What a professional tells their Talent Success Manager never goes to the client, and the client’s check-in never goes to the professional.</span></li>
    <li><b>No ID or tax numbers, ever.</b><span>We keep documents, never the numbers. Nobody marks their own paperwork complete.</span></li>
    <li><b>Client information stays inside Relève.</b><span>Treat every client’s inbox, calendar, numbers and name as if they were ours.</span></li>
    <li><b>Relève accounts only.</b><span>hello@relevestaffing.com and Relève addresses for anything Relève. Never a personal account.</span></li>
    <li><b>No improvised terms.</b><span>No discounts, refunds, start dates or promises that aren’t in writing.</span></li>
    <li><b>No claims we can’t stand behind.</b><span>No cost claims, no invented results, no candidate promised before a call, and no background-check claim until checks are part of our vetting.</span></li>
    <li><b>Day 90 is not the end.</b><span>We support every placement for its whole life.</span></li>
    <li><b>Sage Jackson is the founder.</b><span>Never name anyone else as Relève’s founder.</span></li>
  </ol>

  <div class="take rv"><span class="k">Hold on to this</span><p>When in doubt, protect the client, then ask.</p></div>
</template>

<template id="t-daily" data-title="How we work, every day." data-hook="The last lesson. These are the habits that make Relève feel like Relève from the outside, and what to do whenever you aren’t sure." data-tease="The final check on Part five, then your sign-off.">
  <section class="sec rv">
    <div class="k">The standard of work</div>
    <h2>Small habits, kept every time.</h2>
    <ul class="dots">
      <li><b>Reply within one business day</b>, usually sooner.</li>
      <li><b>Close every loop you open.</b> If you said you would confirm in writing, confirm in writing.</li>
      <li><b>Look before anyone else sees it.</b> Open the email, read the page on your phone, check the name.</li>
      <li><b>Point toward the fix.</b> Say what the good outcome is and how to get there.</li>
      <li><b>Write it down.</b> Notes from every call stay attached to the person for good.</li>
      <li><b>Say when something breaks</b>, the same day. Nobody should hear about a problem from a client first.</li>
    </ul>
  </section>

  <section class="sec rv">
    <div class="k">When you’re not sure</div>
    <ol class="nums">
      <li><b>Check this training.</b> You can come back to any lesson through your link.</li>
      <li><b>Ask Relève in the console</b>, if you have console access.</li>
      <li><b>Ask Sage.</b></li>
      <li><b>Never guess</b> a term, a price or a promise. “Let me confirm that in writing for you” is always the right answer.</li>
    </ol>
  </section>

  <div class="start rv">
    <div class="start-h"><span class="k">Your first week</span><b>What to do after you sign off</b></div>
    <ol>
      <li><em>The site</em>Read relevestaffing.com the way an owner would: the home page, Process, Pricing, Discovery and the free training.</li>
      <li><em>The console</em>If you have console access, sign in with your Relève account and open each of the eight areas once.</li>
      <li><em>The voice</em>Read the latest few issues of The Relève Letter and a week of our posts.</li>
      <li><em>Your questions</em>Bring your list from this training to Sage.</li>
    </ol>
  </div>

  <div class="final rv">
    <h2>Welcome to the watch.</h2>
    <p class="script tag-img"><img src="/consider-it-handled-cream.png" alt="Consider it handled." width="2755" height="414" decoding="async"></p>
    <p>One check left, then your sign-off.</p>
  </div>
</template>
