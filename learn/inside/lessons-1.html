<template id="t-welcome" data-title="Welcome to Relève." data-hook="You have joined a small team with a large promise: when an owner hands something to us, they stop having to think about it. This training shows you how we keep that promise, from the first conversation to the hundredth week of a placement." data-tease="Who started Relève, and the one problem it was built to end.">
  <section class="sec rv">
    <div class="k">What Relève is</div>
    <h2>We place virtual professionals with business owners, then stay for the whole placement.</h2>
    <p>Relève is a fully managed virtual staffing agency. We find, vet and match a virtual professional to a founder or business owner, prepare that person for the role, and support both sides for as long as they work together. We run the agreements and the pay. The owner directs the work, and we handle everything around it.</p>
    <p>Our clients own small businesses in the United States: one to ten people, at least $30,000 a month in revenue, and an owner who is still doing too much of the day-to-day. Our professionals are virtual. On two of our plans they are based offshore; on the third they are hired locally in the US or Europe.</p>
  </section>

  <dl class="facts rv">
    <dt>The name</dt><dd><b>Relève</b> is French for the relief shift: the person who arrives to take over the watch. The accent sits on the second e, always. Say it like the English word <i>relieve</i>.</dd>
    <dt>The promise</dt><dd><b>Consider it handled.</b></dd>
    <dt>Founder</dt><dd><b>Sage Jackson</b></dd>
    <dt>The company</dt><dd>Relève Staffing LLC, a Utah company</dd>
    <dt>Website</dt><dd>relevestaffing.com, where prospects and leads live</dd>
    <dt>The app</dt><dd>app.relevestaffing.com, for signed clients, placed talent and the team only</dd>
    <dt>Our inbox</dt><dd>hello@relevestaffing.com</dd>
  </dl>

  <div class="take rv"><span class="k">Hold on to this</span><p>“Consider it handled” is the feeling every client should have, every week. Everything in this training exists to protect it.</p></div>

  <section class="sec rv">
    <div class="k">How this training works</div>
    <h2>Twenty-two lessons, five short checks, one sign-off.</h2>
    <p>The training runs in six parts and takes about two and a half hours. Each part after the first ends with a five-question check. You pass with four right, and you can retake a check as often as you like. When everything is done, you sign off that you have read the standards and will follow them.</p>
    <p>Your progress saves as you go, on any device you open this link on. The link is yours alone, so please don’t forward it. The team can see how far you have come.</p>
  </section>

  <div class="start rv">
    <div class="start-h"><span class="k">Before you begin</span><b>Three things that will help</b></div>
    <ol>
      <li><em>Go in order</em>Each part builds on the one before it. The sales lessons make much more sense once you know how a placement runs.</li>
      <li><em>Keep a list</em>Write down every question as it comes up and bring the list to Sage. There is no such thing as a small question about a client.</li>
      <li><em>Tell us what doesn’t match</em>Relève is growing and the details change. If something here doesn’t match what you see on the site or in the app, say so the same day so we can fix it.</li>

<template id="t-why" data-title="Why Relève exists." data-hook="Almost every owner we speak with has hired help before, and most of those hires did not last. Relève was built by someone who has sat on both sides of that handoff and knows exactly where it breaks." data-tease="The owner we do our best work for, and how to recognise them in the first five minutes.">
  <section class="sec rv">
    <div class="k">The founder</div>
    <h2>Sage has been the assistant, and the recruiter.</h2>
    <p>Before Relève, Sage Jackson spent seven years as an executive assistant and house manager to CEOs and ultra-high-net-worth entrepreneurs, then six years in recruiting, with more than 300 placements across her career. She helped scale four businesses past seven figures and built the recruiting system for a $50 million company.</p>
    <p>She puts it simply: <b>“I have been the talent.”</b> From the recruiting desk she watched hires that looked perfect on paper fall apart in the second month. From the assistant’s chair, she understood why.</p>
  </section>

  <section class="sec rv">
    <div class="k">The problem</div>
    <h2>Hires rarely fail on skill. They fail on fit.</h2>
    <p>An owner hires someone with the right experience, and within a few weeks something is off. The owner wants updates and the assistant waits to be asked. The owner thinks out loud and the assistant needs everything in writing. Nobody did anything wrong. They simply don’t work the same way.</p>
    <p>So the owner ends up managing the person they hired to take work away. Then they let them go, and the search starts again. <b>The right resume, the wrong working style.</b> That cycle is what Relève exists to end.</p>
  </section>

  <div class="cmp rv">
    <div><h4>What most agencies match on</h4><ul>
      <li>The resume and years of experience</li>
      <li>A list of skills and software</li>
      <li>The hourly rate</li>
      <li>Who is available this week</li>
    </ul></div>
    <div><h4>What Relève matches on as well</h4><ul>
      <li>How the owner works, and how the professional works, measured on both sides</li>
      <li>What the role is made of, competency by competency</li>
      <li>The business itself, studied before the search begins</li>
      <li>Support for the whole life of the placement, not just the introduction</li>
    </ul></div>
  </div>

  <section class="sec rv">
    <div class="k">The mission</div>
    <h2>Capable people who lacked opportunity.</h2>
    <p>The professionals we place are highly capable and hardworking. For many of them, what was missing was access: the right role, with the right person, on fair terms. Sage spent three months living in Asia, in the homes and at the dinner tables of families our work reaches. Relève gives 1% of its profits to a fund that supports talent families.</p>
    <p>That part of our story belongs on the mission and careers pages. With clients, we lead with trust and relief, never with where someone lives or what they cost.</p>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>We exist to end one cycle: hire, manage, replace, start over.</p></div>
</template>

<template id="t-who" data-title="Who we serve." data-hook="We do our best work for one kind of client. Knowing them well is how you spot a strong fit early in a call, and a poor one before anyone loses time." data-tease="The two questions every owner is asking before they hire anyone.">
  <section class="sec rv">
    <div class="k">Our client</div>
    <h2>An owner whose own hours are the product.</h2>
  </section>

  <dl class="facts rv">
    <dt>Where</dt><dd>The United States. Every client is US-based.</dd>
    <dt>Size</dt><dd>One to ten employees. Solo founders and small teams, never corporations.</dd>
    <dt>Revenue</dt><dd>At least $30,000 a month.</dd>
    <dt>Title</dt><dd>Founder, Owner, CEO or Managing Partner.</dd>
    <dt>Stage</dt><dd>Usually two or more years in, growing, and still doing too much of the day-to-day.</dd>
    <dt>Best fit</dt><dd>Coaching and consulting. Agencies and professional services such as law and accounting. Real estate and property management. E-commerce and direct-to-consumer brands. Health and wellness.</dd>
  </dl>

  <section class="sec rv">
    <div class="k">Their week</div>
    <h2>About a third of it goes to work that isn’t theirs to do.</h2>
    <p>Admin, customer replies, scheduling, bookkeeping, social media. The inbox at 11 pm. The lead that waited two days for an answer. The invoice nobody sent. Most of these owners already know what they would hand off first.</p>
    <p>What they don’t have is a person they trust to take it, and a way to hand it over that doesn’t turn into a second job. Many have tried a low-cost VA, a freelancer or an AI tool and been burned once. They arrive careful, and that is fair.</p>
  </section>

  <div class="cmp rv">
    <div><h4>Signs of a strong fit</h4><ul>
      <li>They can name the three things they would hand off first</li>
      <li>They have delegated before and can tell you what went wrong</li>
      <li>The work can be done remotely, on US business hours</li>
      <li>They want someone who owns the work, not someone who waits for instructions</li>
      <li>They have a reason to start now</li>
    </ul></div>
    <div><h4>Who we turn away, kindly</h4><ul>
      <li>Anyone who needs a person physically on site</li>
      <li>Businesses outside the United States</li>
      <li>Larger companies with an HR department and a procurement process</li>
      <li>Owners well below the revenue line, where our fee would strain the business</li>
      <li>Anyone shopping only for the lowest hourly rate</li>
    </ul></div>
  </div>

  <div class="take rv"><span class="k">Hold on to this</span><p>A poor-fit client becomes a placement that fails. Turning one away kindly is part of keeping our promise to the clients we do take.</p></div>
</template>

<template id="t-fears" data-title="What they’re really afraid of." data-hook="Owners rarely hesitate because of price or geography. They hesitate because of two questions they don’t usually say out loud. Answer those two, and the rest of the conversation gets easier." data-tease="The five options an owner has, and where Relève sits among them.">
  <section class="sec rv">
    <div class="k">Fear one · Trust</div>
    <h2>“Can I trust this person to actually handle it?”</h2>
    <p>Owners already know a virtual assistant can clear an inbox. What they don’t know is whether this particular person can be trusted with their clients, their money, their calendar and their name. One dropped ball in front of a client costs them more than a month of our fee.</p>
  </section>

  <section class="sec rv">
    <div class="k">Fear two · Burden</div>
    <h2>“Will they add work instead of taking it off my plate?”</h2>
    <p>The second fear is the evenings spent explaining, checking and correcting. A busy owner would rather have no hire than a hire who needs managing. When someone tells you they “don’t have time to train anyone,” this is the fear speaking.</p>
  </section>

  <div class="cmp rv">
    <div><h4>What we never lead with</h4><ul>
      <li>Cheaper than hiring locally</li>
      <li>Offshore savings, or any cost or percentage claim</li>
      <li>“We’ll fix your inbox”</li>
      <li>A long list of tasks a VA can do</li>
    </ul></div>
    <div><h4>What we lead with</h4><ul>
      <li>Trust, earned on six fronts before they meet anyone</li>
      <li>Relief: two Success Managers handle everything around the work</li>
      <li>Fit: matched to how they work, measured on both sides</li>
      <li>Their hours, back on the work that grows the business</li>
    </ul></div>
  </div>

  <section class="sec rv">
    <div class="k">What they have usually tried</div>
    <h2>Most owners come to us after one of these.</h2>
  </section>
  <div class="acc rv">
    <details><summary>A freelancer from a marketplace<i></i></summary><div class="a"><p>Quick to find and inexpensive. The quality varies, there is no vetting the owner can rely on, and when it goes wrong they start the search again on their own.</p></div></details>
    <details><summary>A low-cost offshore VA<i></i></summary><div class="a"><p>Affordable, but often handed over with little preparation and no support afterwards. The owner becomes the trainer and the manager, which is the exact job they were trying to give away.</p></div></details>
    <details><summary>A friend, or a local hire<i></i></summary><div class="a"><p>Trust comes easier. Cost and flexibility are harder, and the owner still carries all of the management and all of the HR.</p></div></details>
    <details><summary>An AI tool<i></i></summary><div class="a"><p>Good at pieces of tasks: drafting, sorting, summarising. It can’t own the work. It can’t follow up with a client, notice what’s missing, or make a judgment call when something goes sideways.</p></div></details>
  </div>
  <p class="rv">When an owner says “I tried a VA once and it didn’t work,” don’t defend the industry. Ask what happened. Their answer tells you exactly which part of Relève to explain.</p>

  <div class="take rv"><span class="k">Hold on to this</span><p>Every owner is asking two things: can I trust them, and will they add work. Everything we say answers one of the two.</p></div>
</template>

<template id="t-market" data-title="The marketplace, and where we sit." data-hook="An owner who wants help has five real options. Knowing what each one does well, and where each one breaks, lets you talk about the alternatives with respect and still show clearly why Relève is different." data-tease="The lesson to remember if you remember only one: how Relève stands out.">
  <div class="mkt rv">
    <div class="mkt-h"><span></span><span>What it does well</span><span>Where it breaks</span></div>
    <div class="mkt-r"><b>Hiring on your own</b><p>Low cost, wide choice, quick to post on a marketplace or job board.</p><p>The owner sources, screens, interviews, onboards and manages alone. When it fails, nobody else is accountable.</p></div>
    <div class="mkt-r"><b>Offshore VA agencies</b><p>Lower rates and a ready pool of candidates, with some screening.</p><p>Most match on resume and rate. Little preparation for the specific role, support that often ends at the introduction, and a stack of resumes for the owner to sort.</p></div>
    <div class="mkt-r"><b>A local employee</b><p>Same time zone, easy trust, someone in the room.</p><p>Salary, benefits, payroll, HR and recruiting fees. Slow to hire and costly to undo.</p></div>
    <div class="mkt-r"><b>AI tools</b><p>Fast, inexpensive, always on, good at drafting and sorting.</p><p>Can’t own an outcome, make a judgment call or take responsibility for a client relationship.</p></div>
    <div class="mkt-r us"><b>Relève</b><p>Fully managed virtual staff: vetted on six fronts, matched to how the owner works, prepared for the role, and supported by two Success Managers for the life of the placement.</p><p>We are not the cheapest option, and we say so plainly. We open a limited number of client spots each year so every placement gets proper attention.</p></div>
  </div>

  <section class="sec rv">
    <div class="k">Talking about the alternatives</div>
    <h2>Agree with what’s true, then move to what they’ve felt.</h2>
    <ul class="dots">
      <li><b>Never name or criticise another company.</b> Speak about categories, never competitors.</li>
      <li>Agree with what is true: “You can find a VA on a marketplace for less, no question.”</li>
      <li>Then move to the cost the owner has already felt: the hours spent finding someone, getting them started, and replacing them when it didn’t work.</li>
      <li>We aren’t against AI. Our professionals use AI tools every day and can help a client set up simple automations. We put a person in charge of it.</li>
    </ul>
  </section>

  <div class="take rv"><span class="k">Hold on to this</span><p>We don’t compete on price. We compete on whether the hire works.</p></div>
</template>

<template id="t-standout" data-title="How we stand out." data-hook="If you remember one lesson, make it this one. These are the things Relève does that most agencies in our category don’t, and you should be able to explain each of them in a single sentence." data-tease="A five-question check on Part one.">
  <section class="sec rv">
    <div class="k">Answer one · Trust</div>
    <h2>Every professional is vetted on six fronts.</h2>
  </section>
  <div class="fronts">
    <div class="front rv"><b>Your business, studied first</b><span>A free business audit at the start. We learn how the owner works and build the role around what they actually need.</span></div>
    <div class="front rv"><b>Tested for the role</b><span>Capability measured against the work being handed over, discipline by discipline, including a paid day of real work called Taking The Watch™.</span></div>
    <div class="front rv"><b>Matched to how you work</b><span>Both sides take the Relève Signature™, our working style and personality assessment. The fit is designed, not guessed.</span></div>
    <div class="front rv"><b>Identity verified</b><span>Identity and right to work confirmed, and an NDA and confidentiality agreement signed, before anyone is presented.</span></div>
    <div class="front rv"><b>We interview many. You meet one.</b><span>No pile of resumes. One candidate at a time, ready for a yes or a no.</span></div>
    <div class="front rv"><b>Approved by name</b><span>Nobody reaches an owner until a named person at Relève has approved them, with a note on why.</span></div>
  </div>

  <section class="sec rv">
    <div class="k">Answer two · Relief</div>
    <h2>No second job for the owner.</h2>
    <ul class="dots">
      <li><b>Prepared before day one.</b> The professional is briefed on the owner’s tools, standards and recurring work before they start.</li>
      <li><b>The owner’s side, handled.</b> A Client Success Manager is their single point of contact.</li>
      <li><b>The professional’s side, handled.</b> A Talent Success Manager runs their calls, coaching, time off and cover.</li>
      <li><b>Replaced, not restarted.</b> If a hire isn’t right, the next person comes forward, with up to two replacements per placement.</li>
      <li><b>Watched for life.</b> The 90-Day Success Plan gets the professional up and running. We keep watching the work for as long as the client is with us.</li>

  <section class="sec rv">
    <div class="k">The detail nobody else shows</div>
    <h2>The client sees why we chose the person.</h2>
    <p>When we present a candidate, the owner sees the <b>Signature Match</b>: the reasoning behind the choice, where the two of them line up, what is worth knowing before the first call, and confirmation that a person read it before it was sent. Our research found no agency in our category that shows the client its working.</p>
    <p>Every client also gets the Relève app, a delegation desk where they assign tasks, see the moment a task has been seen, review finished work, message their Success Manager and read a report on each month.</p>
