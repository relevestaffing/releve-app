<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F2">
<title>Relève</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background:#FBF8F1;color:#35443A;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:300;text-align:center;-webkit-tap-highlight-color:transparent}
  img{width:min(70vw,360px);height:auto;display:block}
  h1{margin:0;font-family:'Lora',Georgia,'Times New Roman',serif;font-weight:400;font-size:13px;letter-spacing:.3em;text-transform:uppercase}
  p{margin:10px auto 0;max-width:30ch;font-size:15px;line-height:1.7;color:#4E5B52}
  button{font:inherit;font-family:'Lora',Georgia,serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;min-height:48px;padding:0 34px;
    color:#FBF8F1;background:#35443A;border:0;border-radius:0;cursor:pointer;touch-action:manipulation}
  button:active{opacity:.82}
</style>
</head>
<body>
  <img src="/logo-fern.png" alt="Relève Executive Staffing" width="720" height="260">
  <div>
    <h1>One moment</h1>
    <p>Your connection dropped. Everything you saved is safe, and Relève picks up the second you are back.</p>
  </div>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
